  const onboard = P7.recUsed(g), cap = P7.downlinkCap(g);
  return ({
    ret: `Clears depth ${g.depth}${g.stuck ? ' and frees the rover' : ''}. Anything explored but not collected is lost.`,
    collect: `Brings back ${g.depth * 6} cards for ${fn} and resets depth to 0.`,
    explore: `Depth ${g.depth} → ${g.depth + 1}; the next Collect gives ${(g.depth + 1) * 6} cards. Ending the week deep risks a 30% stuck rover.`,
    calibrate: g.persist.calBroken ? 'Repairs the pipeline, so uploads count again.' : `Attaches calibration to ${f && !f.calibrated ? fn : 'the next uncalibrated objective'}. Without it, delivered data scores 0.`,
    analyse: `Packs up to 8 raw cards of ${fn} into half as many; each packed card counts double when sent.`,
    upload: `Sends up to ${Math.min(cap, onboard)} of ${onboard} recorder cards to Earth now, ${fn} first.`,
    repair: g.stuck ? 'Frees the stuck rover without losing depth.' : g.persist.safe ? 'Ends safe mode so robots work again; uses 1 granted slot.' : 'Repairs the damaged wheels so Explore costs normal AP again.',
    service: g.persist.wheel ? 'Fixes the wheel so robots produce full data again; uses 1 granted slot.' : `Adds ${3 * g.build.robots.length} cards (3 per robot) at the end of the week.`,
    command: `Adds 8 cards for ${fn} now, but spends 1 slot (−${cps} cards of downlink).`,
    standdown: `+1 goodwill token (you hold ${g.goodwill}). Spend it later to win a negotiation.`,
    request: `Asks for 3 passes. ${free} ${free === 1 ? 'is' : 'are'} free; ${claimed} more ${claimed === 1 ? 'is' : 'are'} claimed by rivals${free < 3 ? ', so expect a negotiation' : ''}.`,
    commandeer: 'Takes up to 3 passes from non-prime rivals now; costs 1 goodwill token.'
  }[id] || '') + ap;
}

function vOps() {
  const g = APP.game, fx = APP.fx, has = t => fx.some(f => f.type === t);
  const cps = P7.cardsPerSlot(g), adv = advise(g);
  const D = dates();
  const deadlines = {}; g.objectives.forEach(o => (deadlines[o.deadline] = deadlines[o.deadline] || []).push(o));
  const dropped = new Set(fx.filter(f => f.type === 'token').map(f => f.cx * 5 + f.i));
  const contested = new Set(g.conflict ? g.conflict.wells : []);
  const pulsed = APP.pulse || new Set();
  const flagList = [];
  if (g.persist.safe) flagList.push(['bad', 'SAFE MODE']); if (g.persist.wheel) flagList.push(['bad', 'WHEEL FAULT']); if (g.persist.calBroken) flagList.push(['bad', 'CAL PIPELINE BROKEN']);
  if (g.stuck) flagList.push(['bad', 'ROVER STUCK']); if (g.flags.conjunction) flagList.push(['warn', 'CONJUNCTION']); if (g.flags.dust) flagList.push(['warn', 'DUST STORM']);
  if (g.flags.artemis) flagList.push(['warn', 'ARTEMIS SURGE']); if (g.flags.goldstone) flagList.push(['warn', 'GOLDSTONE OFFLINE']); if (g.tradeNext) flagList.push(['good', `${g.tradeNext} OWED NEXT WEEK`]);
  if (g.depth) flagList.push(['warn', `DEPTH ${g.depth}`]);
  const spent = fx.filter(f => f.type === 'ap').reduce((t, f) => t + f.n, 0);
  const pips = Array.from({ length: g.pool }, (_, i) => `<span class="pip ${i >= g.pool - Math.min(g.carry, g.pool) ? 'carry' : ''}"></span>`).join('') + Array.from({ length: spent }, () => '<span class="pip gone" aria-hidden="true"></span>').join('');
  const ev = P7.EVENTS[g.event];
  const s = P7.score(g);
  const wellsHTML = P7.COMPLEXES.map((c, ci) => {
    const row = g.wells.filter(w => w.cx === ci);
    return `<div class="cxrow ${row[0].offline ? 'off' : ''}"><div class="cxname">${c}<small>${['DSS-14 · CA', 'DSS-63 · ES', 'DSS-43 · AU'][ci]}</small></div><div class="wells" role="group" aria-label="${c} wells">${row.map(w => {
      const idx = g.wells.indexOf(w), r = w.holder && w.holder !== 'P7' ? P7.rivalByCode(w.holder) : null;
      const label = `${c} well ${w.i + 1}: ${w.offline ? 'offline' : w.holder === 'P7' ? `yours${w.reduced ? ', smaller aperture at half rate' : ''}${w.used ? ', used' : ', unused'}` : r ? `held by ${r.name}${r.prime ? ' (prime)' : ''}` : w.claim ? `free but claimed by ${P7.rivalByCode(w.claim).name}` : 'free'}${contested.has(idx) ? ', contested' : ''}`;
      return `<button class="well ${w.offline ? 'off' : ''} ${w.claim && !w.holder ? 'claim' : ''} ${contested.has(idx) ? 'contest' : ''} ${pulsed.has(idx) ? 'pulse' : ''} ${dropped.has(idx) ? 'deep' : ''}" data-a="inspect" data-v="${idx}" data-k="well-${idx}" data-well="${idx}" ${w.claim ? `data-claim="${w.claim}"` : ''} aria-label="${esc(label)}" tabindex="${idx === (APP.wellFocus ?? 0) ? 0 : -1}">${w.holder ? `<span class="token ${w.holder === 'P7' ? 'me' : ''} ${r?.prime ? 'prime' : ''} ${w.reduced ? 'reduced' : ''} ${w.used ? 'used' : ''} ${dropped.has(idx) ? 'drop' : ''}" aria-hidden="true">${w.holder}</span>` : ''}</button>`;
    }).join('')}</div></div>`;
  }).join('');
  const objHTML = g.objectives.map(o => {
    const fr = fx.find(f => f.id === o.id && ['returned', 'dark', 'unusable', 'withdrawn'].includes(f.type));
    const onboard = g.rec[o.id] + 2 * g.packed[o.id];
    const risk = o.status === 'live' && (o.need - o.delivered) > projection(g, o);
    const chits = Math.ceil(o.need / 10), doneChits = Math.floor(o.delivered / 10);
    const stampTxt = { returned: 'RETURNED', dark: 'DARK', unusable: 'UNUSABLE', withdrawn: 'WITHDRAWN' }[o.status];
    return `<article class="obj card ${o.id === g.focus ? 'focus' : ''} ${o.status} ${fr ? (o.status === 'returned' ? 'lift' : 'sink') : ''}" aria-label="Objective ${esc(o.name)}, ${stampTxt || 'live'}">
      <div class="cardhead"><span>OBJECTIVE · ${o.tag.toUpperCase()}</span><span>${N(o.pts, 'MODEL', 'pts')}</span></div>
      <h3>${esc(o.name)}</h3>
      <div class="obj-art" style="--art:url(assets/cards/art-${OBJ_ART[o.id]}.png)" aria-hidden="true"></div>
      <div class="meta"><span>Due end of wk ${N(o.deadline, 'MODEL')}</span><span class="calchip ${o.calibrated ? 'on' : 'offc'}">${o.calibrated ? 'CAL ATTACHED' : 'NO CAL'}</span></div>
      <p class="prog">${N(o.delivered, 'MODEL')} <span class="soft">/ ${o.need} at Earth</span></p>
      <div class="fan" aria-hidden="true">${Array.from({ length: chits }, (_, i) => `<i class="${i < doneChits ? 'done' : ''}"></i>`).join('')}</div>
      <p class="soft">On board: ${N(onboard, 'MODEL')} cards ${g.packed[o.id] ? `(${g.packed[o.id]} packed)` : ''}</p>
      ${risk ? `<p class="risk">AT RISK: needs ${o.need - o.delivered}, about ${projection(g, o)} capacity left ${'<sup class="tg tg-DERIVED">DRV</sup>'}</p>` : ''}
      ${o.status === 'live' ? `<div class="acts">${o.id === g.focus ? '<span class="lbl" style="color:var(--teal-ink)">Current target</span>' : `<button class="linkbtn" data-a="focus" data-v="${o.id}" data-k="f-${o.id}">Set as target</button>`}
        ${APP.confirmW === o.id ? `<button class="linkbtn" style="color:var(--red-ink)" data-a="withdraw" data-v="${o.id}" data-k="w-${o.id}">Confirm: withdraw (scores 0, frees ${onboard} cards)</button><button class="linkbtn" data-a="unwithdraw" data-k="uw-${o.id}">Keep</button>` : `<button class="linkbtn" style="color:var(--red-ink)" data-a="askwithdraw" data-v="${o.id}" data-k="aw-${o.id}">Withdraw…</button>`}</div>` : ''}
      ${stampTxt ? `<span class="st"><span class="stamp ${o.status === 'returned' ? 'teal' : o.status === 'withdrawn' ? 'ink' : ''} ${fr ? 'slam' : ''}">${stampTxt}</span></span>` : ''}
    </article>`;
  }).join('');
  // recorder magazine
  const cap = P7.recCap(g), H = 242, per = Math.max(1.4, H / cap - 1);
  const chitN = has('chits') ? (fx.filter(f => f.type === 'chits').reduce((t, f) => t + f.n, 0)) : 0;
  const objCodes = { map: 'MP', ice: 'IC', co2: 'CO', site: 'LS', dune: 'DN', bonus: 'BN' };
  let chits = [];
  g.objectives.forEach(o => { for (let i = 0; i < g.rec[o.id]; i++) chits.push(['', objCodes[o.id]]); for (let i = 0; i < g.packed[o.id]; i++) chits.push(['pk', objCodes[o.id]]); });
  const newFrom = Math.max(0, chits.length - Math.min(8, chitN));
  const magHTML = chits.map(([k, c], i) => `<span class="chit ${k} ${chitN && i >= newFrom ? 'new' : ''}" style="height:${per}px;${chitN && i >= newFrom ? `animation-delay:${(i - newFrom) * 40}ms` : ''}">${per >= 9 ? c : ''}</span>`).join('');
  const lostN = fx.filter(f => f.type === 'overflow').reduce((t, f) => t + f.n, 0);
  const flutter = Array.from({ length: Math.min(6, lostN) }, (_, i) => `<span class="flutter" style="--dx:${(i - 3) * 14}px;animation-delay:${i * 60}ms"></span>`).join('');
  const steps = Array.from({ length: g.build.rec - 1 }, (_, i) => `<span class="steps" style="bottom:${4 + (i + 1) * (H / g.build.rec)}px"></span>`).join('');
  const beam = has('beam');
  const seatsHTML = P7.SEATS.map(seat => `<section class="seat" aria-labelledby="seat-${seat.id}"><h3 id="seat-${seat.id}">${crewAvatar(seat.id)}<span class="sn">${seat.name.toUpperCase()}<span class="who">${CREW[seat.id].name}</span></span><small>${g.spentBySeat[seat.id] ? `spent ${g.spentBySeat[seat.id]} AP` : ''}</small></h3>
      <p class="advice"><b>Suggests:</b> ${esc(adv[seat.id])}</p>
      <div class="strip">${seat.acts.map(id => { const a = P7.ACTIONS[id], c = P7.apCost(g, id), chk = P7.canDo(g, id); const hint = preview(g, id);
        return `<button class="actbtn" data-a="act" data-v="${id}" data-k="act-${id}" ${chk.ok ? '' : `aria-disabled="true"`} aria-describedby="why-${id}"><b>${a.name}</b><span class="cost" aria-label="${c} AP">${'<i></i>'.repeat(c)}</span><span class="why" id="why-${id}">${chk.ok ? esc(hint) : esc(chk.why)}</span></button>`; }).join('')}</div></section>`).join('');
  return `<div class="board paper ${g.persist.safe ? 'is-safe' : ''}" id="board">${svgReg()}
    ${g.persist.safe ? `<svg class="safeframe" width="100%" height="100%" aria-hidden="true"><rect x="0" y="0" width="100%" height="100%" rx="2"/></svg>` : ''}
    <div class="board-grid">
      <header class="b-head">
        <div><h1 class="cartouche" data-t="PRIORITY SEVEN">PRIORITY SEVEN</h1><p class="sub">Phase 3 of 4 · Operations at Mars · ${esc(P7.CLASSES[g.build.cls].name)}</p></div>
        <div class="weektrack" aria-label="Week ${g.week} of 12">
          <ol>${Array.from({ length: 12 }, (_, i) => { const w = i + 1, dl = deadlines[w]; return `<li><span class="wk ${w < g.week ? 'past' : ''} ${dl ? 'dl' : ''}">${String(w).padStart(2, '0')}</span><span class="wkdate">${fmtDate(D[i])}</span>${APP.df.au ? `<span class="wkau ${w === g.week ? 'now' : ''}">${APP.df.au[i].toFixed(2)}</span>` : ''}<span class="wkdl">${dl ? 'DUE ' + dl.map(o => `<abbr data-g="${objCodes[o.id]}">${objCodes[o.id]}</abbr>`).join(' ') : ''}</span></li>`; }).join('')}</ol>
          ${APP.df.au ? '<p class="wkcap">Dates and Earth–Mars range in AU from JPL Horizons <sup class="tg tg-DATA">DATA</sup></p>' : ''}
          <div class="marker ${has('week') && g.week > 1 ? 'step' : ''}" style="--w:${g.week}" aria-hidden="true"><span>${String(g.week).padStart(2, '0')}</span></div>
        </div>
      </header>
      <div class="status">
        <div class="tray"><div class="lbl">Action points<b>${N(g.pool, 'MODEL')}</b></div><div class="tray-well" role="img" aria-label="${g.pool} action points in the shared pool">${pips}</div></div>
        <div class="lbl">Goodwill<b style="display:flex;gap:3px;min-height:26px;align-items:center">${Array.from({ length: g.goodwill }, () => '<span class="gw">GW</span>').join('') || '<span class="soft" style="font:400 12px var(--f-body)">none</span>'}</b></div>
        <div class="lbl">Points<b>${N(s.pts, 'MODEL')} <span class="soft" style="font-size:13px">/ ${s.max}</span></b></div>
        <div class="lbl">Requested time obtained<b>${N(s.obtained, 'DERIVED', '%')}</b></div>
        <div class="flags" aria-label="Active conditions">${flagList.map(([k, t]) => `<span class="flag ${k}">${t}</span>`).join('')}</div>
      </div>

      <section class="antenna" aria-labelledby="ant-h">
        <h2 class="field-title" id="ant-h">Deep Space Network · week ${g.week}<small>${N(15, 'DATA')} wells, rivals hold ${N(g.flags.artemis ? 13 : 9, 'DATA')}</small></h2>
        <div class="field">${wellsHTML}
          <svg class="earth" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="16" fill="#F4F1E8" stroke="#2E5C8A" stroke-width="1.4"/><path d="M14 22q6-4 10 0t10-2M12 30q8 4 14 0t12 2M26 10v32" fill="none" stroke="#2E5C8A" stroke-width="1"/></svg>
          ${beam ? `<svg class="beam" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path id="beampath" d="M20 ${[18, 50, 82][fx.find(f => f.type === 'beam').cx]} C 60 ${[18, 50, 82][fx.find(f => f.type === 'beam').cx]}, 80 10, 101 -6" fill="none" stroke="#3F7A5E" stroke-width=".7" stroke-dasharray="2 1.6" vector-effect="non-scaling-stroke" style="stroke-width:1.6px"><animate attributeName="stroke-dashoffset" from="20" to="0" dur=".9s" repeatCount="1"/><animate attributeName="opacity" values="1;1;0" dur="1.6s" fill="freeze"/></path>${[0, 1, 2, 3].map(i => `<rect width="2.4" height="2" fill="#F4F1E8" stroke="#1A1714" stroke-width=".3" opacity="0"><animate attributeName="opacity" values="0;1;1;0" dur=".9s" begin="${i * .12}s" fill="freeze"/><animateMotion dur=".9s" begin="${i * .12}s" fill="freeze"><mpath href="#beampath"/></animateMotion></rect>`).join('')}</svg>` : ''}
        </div>
        <div class="antenna-foot">
          ${dial(cps, 12, 'cards per slot', 'DERIVED', 'ops')}
          ${orbit(g)}
          <div class="downlink">
            <p class="big">${N(P7.openSlots(g).length, 'MODEL')} <span class="soft" style="font-size:13px">unused slots of ${g.wells.filter(w => w.holder === 'P7').length} granted</span></p>
            <p>Each full slot carries ${N(cps, 'DERIVED')} cards this week; smaller apertures carry half. Earth–Mars range ${N((APP.df.au?.[g.week - 1] ?? 0).toFixed(3), 'DATA', 'AU')} from Horizons.</p>
            ${APP.inspect != null ? `<p class="soft" aria-live="polite">${esc((() => { const w = g.wells[APP.inspect]; if (!w) return ''; const r = w.holder && w.holder !== 'P7' ? P7.rivalByCode(w.holder) : null; return `${P7.COMPLEXES[w.cx]} well ${w.i + 1}: ${w.offline ? 'offline this week' : w.holder === 'P7' ? `yours, ${P7.wellCap(g, w)} cards${w.used ? ' (used)' : ''}` : r ? `${r.name}${r.prime ? ' — PRIME, obtains 99.9% of requested time' : ''}` : w.claim ? `free, but ${P7.rivalByCode(w.claim).name} has a pending claim` : 'free'}`; })())}</p>` : '<p class="soft">Arrow keys move between wells.</p>'}
          </div>
        </div>
      </section>

      <section class="mission" aria-label="Mission cards">
        <div class="mission-row">
          ${eventBlock(g, has)}
          <div class="recorder" aria-label="Recorder ${P7.recUsed(g)} of ${cap} cards">
            <p class="lbl">Recorder</p>
            <div class="mag">${magHTML}${steps}${flutter}</div>
            <p class="cap">${N(P7.recUsed(g), 'MODEL')}<span class="soft">/${cap}</span></p>
            <p class="soft" style="font-size:10.5px">lost ${N(g.stats.overflow, 'MODEL')}</p>
          </div>
        </div>
        <div class="objs">${objHTML}</div>
      </section>

      <div class="seats">${seatsHTML}</div>
      <div class="endweek">
        <p style="font-size:13px;max-width:60ch">Four seats share one pool of ${N(8, 'MODEL')} AP a week; unused AP carries over (up to ${N(8, 'MODEL')}). Robots generate at week's end. Overflow is deleted.</p>
        <button class="tab red" data-a="end" data-k="endweek" ${P7.canEndWeek(g).ok ? '' : 'aria-disabled="true"'}>END WEEK ${String(g.week).padStart(2, '0')}</button>
      </div>

      <div class="bottom">
        <aside class="legend" aria-labelledby="lg-h"><h3 id="lg-h">KEY</h3><table><tbody>
          <tr><td><span class="token me" style="width:22px;height:22px;line-height:22px;font-size:8px;display:inline-block">P7</span></td><td>Your pass. Small disc: smaller aperture at half rate. Faded: already used.</td></tr>
          <tr><td><span class="token prime" style="width:22px;height:22px;line-height:22px;font-size:7px;display:inline-block">MRO</span></td><td>Rival pass. Dashed ring: PRIME mission (MRO, Europa Clipper), never commandeered.</td></tr>
          <tr><td><span class="lgw" style="background:repeating-linear-gradient(45deg,var(--paper-deep) 0 3px,rgba(192,132,34,.55) 3px 4.5px)"></span></td><td>Free well with a rival's pending claim. Requesting it raises a negotiation.</td></tr>
          <tr><td><span class="lgw" style="background:repeating-linear-gradient(-45deg,var(--paper-deep) 0 4px,var(--paper-edge) 4px 5px)"></span></td><td>Offline complex.</td></tr>
          <tr><td class="num">DATA · DRV · MDL</td><td>Every figure is tagged: published NASA figure, derived from one, or game balance.</td></tr>
          <tr><td class="num">D R U K W S</td><td>Keys: Draw the event card, Request, Upload, calibrate, end Week, Status read-out.</td></tr>
        </tbody></table></aside>
        <section class="log" aria-labelledby="log-h"><h3 id="log-h">Mission log</h3><ol>${g.log.slice(0, 14).map(l => `<li class="k-${l.kind}"><span class="soft">W${String(l.w).padStart(2, '0')}</span> ${esc(l.msg)}</li>`).join('')}</ol></section>
      </div>
      ${netStrip()}
      <div class="boardfoot"><span class="printcode">P7-BOARD-REV-C · NASA SPACE APPS 2026</span>
        <div class="toolbar">${toggles()}<button class="linkbtn" data-a="tour" data-v="again" data-k="o-tour">Briefing</button><button class="linkbtn" data-a="go" data-v="cards" data-k="o-cards">Cards</button><button class="linkbtn" data-a="crew" data-k="o-crew">Crew</button><button class="linkbtn" data-a="go" data-v="rules" data-k="o-rules">Rules</button><button class="linkbtn" data-a="go" data-v="sources" data-k="o-src">Sources</button><button class="linkbtn" data-a="abandon" data-k="o-quit">${APP.confirmQuit ? 'Confirm: end mission now' : 'End mission…'}</button></div></div>
    </div>
  </div>
  ${g.conflict || APP.leaving ? vNego(g) : ''}`;
}

function toggles() {
  return `<button class="toggle" data-a="audio" aria-pressed="${APP.audio}" data-k="t-audio">Sound ${APP.audio ? 'on' : 'off'}</button>
    <button class="toggle" data-a="sonify" aria-pressed="${APP.sonify}" data-k="t-son">Audio-only mode ${APP.sonify ? 'on' : 'off'}</button>
    ${APP.sonify ? `<button class="toggle" data-a="blank" aria-pressed="${APP.blank}" data-k="t-blank">Blank the screen</button>` : ''}`;
}

function vNego(g) {
  const c = g.conflict || APP.leaving.conflict, gg = g.conflict ? g : APP.leaving;
  const r = P7.rivalByCode(c.rival), enter = APP.fx.some(f => f.type === 'conflict');
  return `<div class="wash" aria-hidden="true"></div>
  <section class="nego card ${g.conflict ? (enter ? 'enter' : '') : 'leave'}" role="dialog" aria-modal="true" aria-labelledby="ng-h" aria-describedby="ng-d">
    <div class="cardhead" style="color:var(--ochre-ink)"><span>SCHEDULE CONFLICT · WEEK ${String(gg.week).padStart(2, '0')}</span><span>${r.prime ? 'PRIME' : 'NON-PRIME'}</span></div>
    <h2 id="ng-h">${esc(r.name)} holds ${N(c.short, 'MODEL')} of the slots you asked for</h2>
    <p id="ng-d">You were granted ${N(c.got, 'MODEL')} of ${N(3, 'MODEL')}. ${r.prime ? 'In JPL’s scheduling experiment, giving prime missions priority let them keep 99.9% of their requested time while the system total fell to 83% <sup class="tg tg-DATA">DATA</sup>.' : 'They will move if you give them something.'} Choose a counter-proposal.</p>
    <div class="opts">${Object.entries(P7.CONFLICT_OPTS).map(([k, o]) => { const chk = P7.canResolve(gg, k); return `<button class="opt" data-a="resolve" data-v="${k}" data-k="opt-${k}" ${chk.ok ? '' : 'aria-disabled="true"'}><b>${o.name}</b><span>${esc(chk.ok ? (chk.note ? o.desc(gg) + ' ' + chk.note : o.desc(gg)) : chk.why)}</span></button>`; }).join('')}
      <button class="opt refuse" aria-disabled="true" data-a="refuse" data-k="opt-refuse"><b>Just refuse</b><span>A mission that disagrees must counter-propose. Undoing another mission's proposal is not allowed. <sup class="tg tg-DATA">DATA · JPL ICAPS 2016</sup></span></button>
    </div>
  </section>`;
}

function vDebrief() {
  const g = APP.game, s = P7.score(g);
  const stampOf = o => ({ returned: ['RETURNED', 'teal'], dark: ['DARK', ''], unusable: ['UNUSABLE', ''], withdrawn: ['WITHDRAWN', 'ink'] }[o.status] || ['DARK', '']);
  const bars = [...BENCH, { name: 'You: requested time obtained', v: s.obtained, me: true }];
  const W = 640, rowH = 30, x0 = 220, sx = v => x0 + (W - x0 - 40) * v / 100;
  return `<article class="report card" aria-labelledby="rp-h">${svgReg()}
    <div class="cardhead"><span>PHASE 4 OF 4 · MISSION REPORT P7-${String(g.seed % 1000).padStart(3, '0')}</span><span class="num">${fmtDate(dates()[0])} – ${fmtDate(dates()[11])}</span></div>
    <h1 id="rp-h" class="cartouche" data-t="DEBRIEF">DEBRIEF</h1>
    <p class="soft" style="margin-top:6px">${esc(P7.CLASSES[g.build.cls].name)} · ${g.build.robots.map(r => P7.ROBOTS[r].name).join(', ')} · ${esc(P7.DISHES[g.build.dish].name)}, ${g.build.band}-band · ${g.build.rec * 20}-card recorder${g.build.target && g.build.target !== 'mars' ? ` · extended target ${esc(APP.data.sbdb[g.build.target]?.name || '')}` : ''}</p>
    ${s.failed ? `<p style="margin-top:12px"><span class="stamp">MISSION FAILED</span> <span class="soft" style="margin-left:10px">Under 40% of possible points (${N(Math.ceil(s.max * .4), 'MODEL')} needed).</span></p>` : ''}
    <table class="ledger"><thead><tr><th>Objective</th><th>Delivered</th><th>Due</th><th>Points</th><th>Outcome</th></tr></thead><tbody>
      ${g.objectives.map(o => { const [t, k] = stampOf(o); return `<tr><td>${esc(o.name)}</td><td class="n">${o.delivered} / ${o.need}</td><td class="n">wk ${o.deadline}</td><td class="n">${o.status === 'returned' ? o.pts : 0}</td><td><span class="stamp ${k}" style="font-size:12px;padding:2px 7px;border-width:2px">${t}</span></td></tr>`; }).join('')}
    </tbody></table>
    <div class="figs">
      <div class="fig"><b data-count="${s.pts}">0</b><span>Points of ${s.max} possible ${'<sup class="tg tg-MODEL">MDL</sup>'}</span></div>
      <div class="fig"><b data-count="${s.retained}" data-suffix="%">0%</b><span>Objectives retained (${s.done} of ${s.committed}) ${'<sup class="tg tg-DERIVED">DRV</sup>'}</span></div>
      <div class="fig"><b data-count="${s.obtained}" data-suffix="%">0%</b><span>Requested time obtained ${'<sup class="tg tg-DERIVED">DRV</sup>'}</span></div>
    </div>
    <p style="font-size:13px">Generated ${N(g.stats.generated, 'MODEL')} cards · delivered ${N(g.stats.delivered, 'MODEL')} · lost to recorder overflow ${N(g.stats.overflow, 'MODEL')} · arrived unusable ${N(g.stats.lostCal, 'MODEL')} · conflicts ${N(g.stats.conflicts, 'MODEL')}.</p>
    <h2 style="font:600 16px var(--f-narrow);margin-top:20px">Requested time obtained, against published scheduler results <sup class="tg tg-DATA">DATA</sup></h2>
    <div class="tablewrap"><svg class="bars" viewBox="0 0 ${W} ${bars.length * rowH + 30}" role="img" aria-label="Bar chart comparing your ${s.obtained}% with schedulers at 82, 88, 91 and 83 percent">
      ${[0, 25, 50, 75, 100].map(v => `<path d="M${sx(v)} 4V${bars.length * rowH + 6}" stroke="#D6CDB8"/><text x="${sx(v)}" y="${bars.length * rowH + 22}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="10" fill="#5A5248">${v}%</text>`).join('')}
      <path d="M${x0} 4V${bars.length * rowH + 6}" stroke="#1A1714"/>
      ${bars.map((b, i) => `<text x="${x0 - 10}" y="${i * rowH + 22}" text-anchor="end" font-family="Archivo Narrow,Arial Narrow,sans-serif" font-weight="600" font-size="12" fill="#1A1714">${esc(b.name)}</text>
        <rect x="${x0}" y="${i * rowH + 9}" width="${sx(b.v) - x0}" height="16" fill="${b.me ? '#3F7A5E' : '#2E5C8A'}" fill-opacity="${b.me ? 1 : .8}"/>

function reportText() {
  const g = APP.game, s = P7.score(g);
  return [`PRIORITY SEVEN — MISSION REPORT`, `${P7.CLASSES[g.build.cls].name}: ${g.build.robots.map(r => P7.ROBOTS[r].name).join(', ')}; ${P7.DISHES[g.build.dish].name} ${g.build.band}-band; recorder ${g.build.rec * 20} cards`, '',
    ...g.objectives.map(o => `${o.status.toUpperCase().padEnd(10)} ${o.name} — ${o.delivered}/${o.need} by wk ${o.deadline}${o.status === 'returned' ? ` (+${o.pts})` : ''}`), '',
    `Points ${s.pts}/${s.max} · Objectives retained ${s.retained}% · Requested time obtained ${s.obtained}%`,
    `Generated ${g.stats.generated} · delivered ${g.stats.delivered} · overflow lost ${g.stats.overflow} · unusable ${g.stats.lostCal}`,
    `Benchmarks (DATA): equal-priority 82%, greedy 88%, Squeaky Wheel 91%, prime-favouring 83% overall.`,
    `Galileo kept 70%. You kept ${s.retained}%.`].join('\n');
}

function vRules() {
  return `<article class="doc card" aria-labelledby="ru-h">${svgReg()}
    <div class="frame-head"><div><p class="phase">Rulebook</p><h1 id="ru-h" class="cartouche" data-t="RULES OF PLAY">RULES OF PLAY</h1></div><button class="tab small" data-a="go" data-v="${APP.back}" data-k="r-back">BACK</button></div>
    <p><b>Only data that reaches Earth, calibrated, before its deadline scores.</b> Everything you collect and cannot send is worth nothing.</p>
    <h2>The week</h2><ol>
      <li>Everyone draws the top card of a shuffled, face-down event deck (14 cards, 12 used each game). The same card applies to all four seats and nothing else can happen until it is drawn. Bad ones last a week or stay until a seat fixes them; good ones are a gift.</li>
      <li>The four seats share ${N(8, 'MODEL')} action points (AP). Unused AP carries over, up to ${N(8, 'MODEL')}. Four seats at 2 AP each spend the pool exactly, so a 3 AP move means someone drops to 1.</li>
      <li>The Flight Director makes one request a week for ${N(3, 'MODEL')} slots. Free wells are granted. Wells a rival holds or has claimed raise a negotiation.</li>
      <li>Upload sends recorder cards over your unused slots: target objective first, then by deadline.</li>
      <li>At week's end robots generate cards. Anything above recorder capacity is deleted. If the rover is deep in exploration it may get stuck (${N(30, 'MODEL', '%')}). Objectives past deadline go DARK; delivered but uncalibrated go UNUSABLE.</li></ol>
    <h2>Seats</h2><div class="tablewrap"><table class="src"><thead><tr><th>Seat</th><th>1 AP</th><th>2 AP</th><th>3 AP</th></tr></thead><tbody>
      <tr><td>Explorer</td><td>Return: clear depth, free rover</td><td>Collect: depth × 6 cards, consumes the stack</td><td>Explore Further: depth +1, costs 3 + depth</td></tr>
      <tr><td>Researcher</td><td>Calibrate: attach calibration, or fix the pipeline</td><td>Analyse: pack 2 raw cards into 1 (up to 8)</td><td>Upload over unused slots</td></tr>
      <tr><td>Engineer</td><td>Repair: free rover, or recover safe mode (needs a slot)</td><td>Service: fix wheel (needs a slot), else +3/robot</td><td>Command Robots: +8 cards, uses a slot</td></tr>
      <tr><td>Flight Director</td><td>Stand Down: +1 goodwill</td><td>Request 3 slots (once a week)</td><td>Commandeer 3 non-prime wells, −1 goodwill</td></tr></tbody></table></div>
    <h2>Negotiation</h2><p>You cannot simply refuse. The DSN rule is that a mission that disagrees must counter-propose. Split the difference, take smaller apertures at half rate, trade for next week, concede for goodwill, or spend goodwill to make a non-prime rival yield.</p>
    <h2>Withdrawing</h2><p>When an objective cannot make its deadline, withdraw it. Its cards leave the recorder and its robot goes idle, which frees capacity for the rest. This is the decision the game is about.</p>
    <h2>Glossary</h2><p>Hover or tap any underlined word, tag or code in the game to see these.</p>
    <dl class="glossary">${Object.entries(GLOSS).map(([k, [h, d]]) => `<dt>${esc(k)}</dt><dd><b>${esc(h)}.</b> ${esc(d)}</dd>`).join('')}</dl>
    <h2>Keyboard</h2><p>Tab moves through every control. Arrow keys move between wells. D draws the event card, R requests, U uploads, K calibrates, W ends the week, S reads the board aloud in audio-only mode.</p>
  </article>`;
}

const GLOSS_TEXT = /\b(AU|AP|dBi|DSN|X-band|Ka-band|HiRISE|PRIME|Mbit|DSS-(?:14|63|43))\b/g;
function glossKey(el) {
  if (el.dataset.g) return el.dataset.g;
  if (el.classList.contains('tg')) return /DATA/.test(el.textContent) ? 'DATA' : /DRV/.test(el.textContent) ? 'DRV' : 'MDL';
  if (el.classList.contains('gw')) return 'GW';
  if (el.classList.contains('calchip')) return 'CAL';
  const c = el.textContent.trim().replace(/\s*✓$/, '');
  return GLOSS[c] ? c : null;
}
/* wrap glossary words in rendered text so they can be hovered or tapped */
function glossWrap(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => {
    const p = n.parentElement; if (!p || p.closest('svg,textarea,script,style,abbr,.tg,.gloss,title')) return NodeFilter.FILTER_REJECT;
    GLOSS_TEXT.lastIndex = 0; return GLOSS_TEXT.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; } });
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => { const s = document.createElement('span'); s.innerHTML = esc(n.nodeValue).replace(GLOSS_TEXT, m => `<abbr data-g="${m}">${m}</abbr>`); n.replaceWith(...s.childNodes); });
}
const GLOSS_SEL = '[data-g],.tg,.token,.code,.gw,.calchip,.deck-pip';
let glossEl = null, glossFor = null;
function glossShow(el) {

  glossEl.innerHTML = `<b>${esc(GLOSS[k][0])}</b>${esc(GLOSS[k][1])}`; glossEl.hidden = false; glossFor = el;
  const r = el.getBoundingClientRect(), g = glossEl.getBoundingClientRect();
  let x = Math.min(Math.max(12, r.left + r.width / 2 - g.width / 2), innerWidth - g.width - 12), y = r.top - g.height - 8;
  if (y < 8) y = r.bottom + 8;

}

  if (g.conflict) { if (e.key === 'Tab') { const opts = [...document.querySelectorAll('.nego button')]; const i = opts.indexOf(document.activeElement); if (i === -1 || (e.shiftKey && i === 0) || (!e.shiftKey && i === opts.length - 1)) { e.preventDefault(); opts[e.shiftKey ? opts.length - 1 : 0].focus(); } } return; }
  const map = { d: () => HANDLERS.draw(), r: () => HANDLERS.act('request'), u: () => HANDLERS.act('upload'), k: () => HANDLERS.act('calibrate'), w: () => HANDLERS.end(), s: () => { const m = statusText(g); document.getElementById('live').textContent = m; if (APP.sonify) { try { speechSynthesis.cancel(); } catch (x) { } speak(m); } } };
  const f = map[e.key.toLowerCase()]; if (f) { e.preventDefault(); f(); }
});

let swipeX = null;
document.addEventListener('pointerdown', e => { if (e.target.closest?.('#deckstage') && !e.target.closest('button')) swipeX = e.clientX; });
document.addEventListener('pointerup', e => { if (swipeX == null) return; const dx = e.clientX - swipeX; swipeX = null; if (Math.abs(dx) > 50) HANDLERS.deck(dx < 0 ? 1 : -1); });

/* ---------- boot ---------- */
APP.audio = !!store('audio');
const hot = window.claude?.hot;
function start(d) { if (d && d.screen) { Object.assign(APP, { screen: d.screen, build: d.build || APP.build, game: d.game || null, cruise: d.cruise || 0 }); if (APP.game) APP.lastLogN = APP.game.logN || 0; } render(); loadSources(); }
try { hot?.ready ? hot.ready(start) : start(hot?.data ?? {}); } catch (e) { start({}); }
</script>
