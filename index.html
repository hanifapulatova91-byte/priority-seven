<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Priority Seven</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23F4F1E8'/%3E%3Cpath d='M5 11Q16 22 27 11L22 21Q16 25 10 21Z' fill='none' stroke='%231A1714' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M16 21V28M11 28H21' stroke='%23D2351E' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="description" content="A printed-board game about Deep Space Network antenna time: design a Mars mission, fight for passes, and choose which science to give up.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600&family=Archivo+Narrow:wght@600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: one printed board per frame, folded down the centre; antenna field left, mission cards right, seat strips across the bottom edge. */
:root{
  --paper:#F4F1E8; --paper-deep:#E7E0CF; --paper-edge:#D6CDB8;
  --ink:#1A1714; --ink-soft:#5A5248;
  --red:#D2351E; --blue:#2E5C8A; --teal:#3F7A5E; --ochre:#C08422;
  /* text-safe darkenings of the two inks that fail 4.5:1 on paper */
  --red-ink:#A92A16; --ochre-ink:#7D5410; --teal-ink:#33664E;
  --f-display:"Archivo Black","Arial Black",Impact,sans-serif;
  --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-narrow:"Archivo Narrow","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --grain:none; --grain-mask:none;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;min-height:100vh}
body.on-table{background:var(--paper-deep)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:var(--grain);opacity:.05;mix-blend-mode:multiply;z-index:0}
#app{position:relative;z-index:1;max-width:1280px;margin:0 auto}
button,input{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tg{font:600 8.5px/1 var(--f-mono);vertical-align:super;margin-left:2px;letter-spacing:.02em;color:var(--ink-soft)}
.tg-DATA{color:var(--teal-ink)} .tg-DERIVED{color:var(--blue)} .tg-MODEL{color:var(--ochre-ink)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.soft{color:var(--ink-soft)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

/* ---------- materials ---------- */
.paper{position:relative;background:var(--paper)}
.paper::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:var(--grain);opacity:.07;mix-blend-mode:multiply;border-radius:inherit}
.cartouche{position:relative;font:400 clamp(30px,5vw,56px)/.92 var(--f-display);letter-spacing:.02em;z-index:0;isolation:isolate}
.cartouche::before{content:attr(data-t);position:absolute;left:.6px;top:-.6px;width:100%;white-space:pre-line;color:var(--red);opacity:.22;z-index:-1}
.card{background:var(--paper);border-radius:2px;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 0 var(--paper-edge),0 2px 3px rgba(26,23,20,.14),0 8px 18px -8px rgba(26,23,20,.22)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:var(--grain);opacity:.06;mix-blend-mode:multiply}
.stamp{font:400 18px/1 var(--f-display);letter-spacing:.06em;color:var(--red-ink);border:3px solid var(--red-ink);padding:4px 10px;
  transform:rotate(-8deg);opacity:.8;border-radius:3px;display:inline-block;-webkit-mask-image:var(--grain-mask);mask-image:var(--grain-mask);-webkit-mask-size:120px;mask-size:120px;background:transparent}
.stamp.teal{color:var(--teal-ink);border-color:var(--teal-ink)}
.stamp.ink{color:var(--ink-soft);border-color:var(--ink-soft)}
.reg{position:absolute;width:14px;height:14px;color:var(--paper-edge);pointer-events:none}
.reg.tl{left:6px;top:6px}.reg.tr{right:6px;top:6px}.reg.bl{left:6px;bottom:6px}.reg.br{right:6px;bottom:6px}
.printcode{font:400 8px/1 var(--f-mono);color:var(--ink-soft);letter-spacing:.04em}
.rule{border:0;border-top:1px solid var(--paper-edge);margin:0}

/* printed tab buttons */
.tab{font:400 15px/1 var(--f-display);letter-spacing:.04em;background:var(--paper);border:0;padding:13px 20px 12px;cursor:pointer;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 1px var(--ink),3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.tab:hover{transform:translate(-1px,-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 1px var(--ink),4px 4px 0 var(--ink)}
.tab:active{transform:translate(2px,2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 1px var(--ink),1px 1px 0 var(--ink)}
.tab.red{background:var(--red-ink);color:var(--paper);box-shadow:0 0 0 1px var(--ink),3px 3px 0 var(--ink)}
.tab.small{font-size:12px;padding:9px 12px 8px}
.tab[aria-disabled="true"]{opacity:.45;cursor:not-allowed;transform:none}
.linkbtn{background:none;border:0;padding:0;font:600 13px var(--f-narrow);color:var(--blue);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* ---------- title ---------- */
.title-frame{min-height:calc(100vh - 60px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:center;padding:24px 0;position:relative}
.title-frame .lede{max-width:34ch;font-size:17px;margin-top:22px}
.title-frame .kicker{font:600 14px var(--f-narrow);color:var(--red-ink);margin-bottom:14px}
.title-frame .tabs{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}
.title-frame .subline{font:600 13px var(--f-narrow);color:var(--ink-soft);margin-top:10px;letter-spacing:.01em}
.dish-art{width:100%;max-width:520px;justify-self:end;color:var(--blue)}
.title-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--paper-edge);padding-top:10px;margin-top:10px}

/* ---------- generic frame header ---------- */
.frame-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.frame-head h1{font:400 clamp(24px,3.4vw,36px)/1 var(--f-display);letter-spacing:.02em}
.phase{font:600 13px var(--f-narrow);color:var(--red-ink)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toggle{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-narrow);background:var(--paper);border:1px solid var(--ink);padding:6px 9px;cursor:pointer;border-radius:2px}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* ---------- board ---------- */
.board{position:relative;padding:30px 30px 22px;border-radius:3px;
  box-shadow:0 1px 0 var(--paper-edge),0 3px 6px rgba(26,23,20,.12),0 22px 40px -18px rgba(26,23,20,.35)}
.board::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:14px;transform:translateX(-50%);pointer-events:none;z-index:2;
  background:linear-gradient(90deg,transparent,rgba(26,23,20,.07) 42%,rgba(26,23,20,.12) 50%,rgba(26,23,20,.05) 58%,transparent)}
.board-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px 44px;position:relative}
.b-head{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px 28px;align-items:center}
.b-head .cartouche{font-size:clamp(26px,3vw,40px)}
.b-head .sub{font:600 12px var(--f-narrow);color:var(--ink-soft);margin-top:6px}
.field-title{font:600 15px var(--f-narrow);display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid var(--paper-edge);padding-bottom:4px;margin-bottom:12px}
.field-title small{font:400 11px var(--f-body);color:var(--ink-soft)}

/* week track */
.weektrack{position:relative;padding:6px 0 4px}
.weektrack ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));position:relative}
.weektrack ol::before{content:"";position:absolute;left:4%;right:4%;top:15px;border-top:1px dashed var(--ink-soft);opacity:.6}
.weektrack li{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.wk{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper);display:grid;place-items:center;font:600 11px var(--f-mono);position:relative;z-index:1}
.wk.past{background:var(--paper-deep);color:var(--ink-soft);border-color:var(--ink-soft)}
.wk.dl{box-shadow:0 0 0 3px var(--paper),0 0 0 4.5px var(--red)}
.wkdate{font:400 9px var(--f-mono);color:var(--ink-soft)}
.wkau{font:400 9px var(--f-mono);color:var(--blue)}
.wkau.now{font-weight:600}
.wkcap{font:400 9.5px var(--f-mono);color:var(--ink-soft);text-align:right;margin-top:2px}
.orbit{width:160px;flex:none}
.orbit figcaption{font:600 10.5px/1.3 var(--f-narrow);color:var(--ink-soft);text-align:center;margin-top:2px}
.wkdl{font:600 8.5px var(--f-narrow);color:var(--red-ink);height:10px}
.marker{position:absolute;top:2px;width:calc(100% / 12);display:flex;justify-content:center;pointer-events:none;z-index:3;left:calc((var(--w) - 1) * 100% / 12)}
.marker span{width:38px;height:38px;border-radius:50%;margin-top:-2px;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.5),transparent 46%),var(--red);
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.28),0 2px 2px rgba(26,23,20,.3),0 6px 8px -4px rgba(26,23,20,.4);
  display:grid;place-items:center;font:600 12px var(--f-mono);color:var(--paper)}
.marker.step{animation:markstep .3s steps(1) both}
@keyframes markstep{from{transform:translateX(-100%)}to{transform:none}}

/* status cluster */
.status{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:16px 26px;align-items:stretch}
.tray{display:flex;align-items:center;gap:10px}
.tray-well{display:flex;flex-wrap:wrap;gap:5px;padding:7px 9px;background:var(--paper-deep);border-radius:14px;min-width:150px;max-width:300px;
  box-shadow:inset 0 2px 3px rgba(26,23,20,.24),inset 0 -1px 0 rgba(255,255,255,.5)}
.pip{width:16px;height:16px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),transparent 50%),var(--ink);
  box-shadow:inset 0 -1px 2px rgba(0,0,0,.4),0 1px 1px rgba(26,23,20,.35)}
.pip.carry{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),transparent 50%),var(--blue)}
.pip.gone{animation:pipout .2s ease-out forwards}
@keyframes pipout{to{transform:translateY(-14px) scale(.8);opacity:0}}
.lbl{font:600 12px var(--f-narrow);color:var(--ink-soft);line-height:1.2}
.lbl b{display:block;font:600 20px/1.1 var(--f-mono);color:var(--ink)}
.gw{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font:600 9px var(--f-mono);color:var(--paper);
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.5),transparent 46%),var(--ochre);box-shadow:inset 0 -2px 2px rgba(0,0,0,.25),0 2px 2px rgba(26,23,20,.3)}
.flags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.flag{font:600 11px var(--f-narrow);border:1.5px solid currentColor;padding:2px 6px;border-radius:2px}
.flag.bad{color:var(--red-ink)} .flag.warn{color:var(--ochre-ink)} .flag.good{color:var(--teal-ink)}

/* antenna field */
.antenna{position:relative}
.field{background:var(--paper-deep);padding:14px 14px 12px;border-radius:2px;position:relative;box-shadow:inset 0 0 0 1px var(--paper-edge)}
.cxrow{display:grid;grid-template-columns:86px minmax(0,1fr);align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--paper-edge)}
.cxrow:last-of-type{border-bottom:0}
.cxname{font:600 13px/1.1 var(--f-narrow)}
.cxname small{display:block;font:400 9.5px var(--f-mono);color:var(--ink-soft);margin-top:2px}
.cxrow.off .cxname{color:var(--ink-soft);text-decoration:line-through}
.wells{display:flex;gap:7px;flex-wrap:wrap}
.well{width:46px;height:34px;border-radius:3px;background:var(--paper-deep);border:0;padding:0;display:grid;place-items:center;position:relative;cursor:pointer;
  box-shadow:inset 0 2px 3px rgba(26,23,20,.26),inset 0 -1px 0 rgba(255,255,255,.5),0 0 0 1px rgba(214,205,184,.9)}
.well.off{background:repeating-linear-gradient(-45deg,var(--paper-deep) 0 4px,var(--paper-edge) 4px 5px);cursor:default}
.well.claim::before{content:"";position:absolute;inset:3px;border-radius:2px;background:repeating-linear-gradient(45deg,transparent 0 3px,rgba(192,132,34,.55) 3px 4.5px)}
.well.claim::after{content:attr(data-claim);position:absolute;bottom:-1px;right:2px;font:600 7.5px var(--f-mono);color:var(--ochre-ink)}
.well.contest{z-index:60;box-shadow:inset 0 2px 3px rgba(26,23,20,.26),0 0 0 2px var(--paper),0 0 0 4px var(--ochre),0 0 0 9px rgba(192,132,34,.25)}
.well.pulse{animation:ringpulse .22s ease-in-out 2}
@keyframes ringpulse{50%{box-shadow:inset 0 2px 3px rgba(26,23,20,.26),0 0 0 2px var(--paper),0 0 0 6px var(--teal)}}
.well.deep{animation:welldeep .26s ease-out}
@keyframes welldeep{40%{box-shadow:inset 0 4px 6px rgba(26,23,20,.42),0 0 0 1px rgba(214,205,184,.9)}}
.token{width:30px;height:30px;border-radius:50%;position:relative;z-index:1;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),transparent 46%),var(--blue);
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.28),0 2px 2px rgba(26,23,20,.3),0 6px 8px -4px rgba(26,23,20,.4);
  font:600 9px/30px var(--f-mono);text-align:center;color:#F4F1E8;letter-spacing:-.02em}
.token.me{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),transparent 46%),var(--teal);font-size:10px}
.token.prime::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px dashed rgba(244,241,232,.7)}
.token.reduced{width:22px;height:22px;line-height:22px;font-size:8px}
.token.used{opacity:.55}
.token.drop{animation:drop .26s cubic-bezier(.3,1.6,.5,1) both}
@keyframes drop{from{transform:translateY(-14px);opacity:.2}to{transform:none;opacity:1}}
.antenna-foot{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;margin-top:14px}
.antenna-foot .downlink{flex:1 1 230px;min-width:0}
.dial{width:150px}
.dial .needle{transform-origin:75px 78px;transform:rotate(var(--a));}
.dial .needle.sweep{animation:needle .42s cubic-bezier(.34,1.56,.64,1) both}
@keyframes needle{from{transform:rotate(var(--a0))}to{transform:rotate(var(--a))}}
.downlink p{font-size:13px}
.downlink .big{font:600 22px/1.1 var(--f-mono)}
.beam{position:absolute;inset:0;pointer-events:none;overflow:visible}
.earth{position:absolute;right:-18px;top:-26px;width:52px;height:52px}

/* mission side */
.mission{display:flex;flex-direction:column;gap:18px;min-width:0}
.event{padding:14px 16px 14px;transform:rotate(-3deg);max-width:380px;border-top:5px solid var(--red)}
.event.deal{animation:deal .42s cubic-bezier(.17,.84,.44,1) both}
@keyframes deal{from{transform:translate(260px,-220px) rotate(14deg) scale(1.08);opacity:0}to{transform:rotate(-3deg)}}
.event h3{font:400 17px/1.15 var(--f-display);letter-spacing:.01em;margin:4px 0 6px}
.event .eff{font-size:13px}
.event dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;margin:8px 0 0;font-size:12px;line-height:1.35}
.event dt{font:600 12px var(--f-narrow);color:var(--ink-soft)}
.event dd{margin:0}
.cardhead{display:flex;justify-content:space-between;gap:8px;font:600 11px var(--f-narrow);color:var(--red-ink)}
.mission-row{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:18px;align-items:start}
.objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px 14px}
.obj{padding:11px 12px 10px;font-size:12px;line-height:1.4;transition:transform .2s,box-shadow .2s,filter .5s}
.obj:nth-child(odd){transform:rotate(-2deg)} .obj:nth-child(even){transform:rotate(1.6deg)}
.obj.focus{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 2px var(--teal),0 2px 3px rgba(26,23,20,.14),0 10px 20px -8px rgba(26,23,20,.3)}
.obj h3{font:600 14px/1.15 var(--f-narrow);margin:3px 0 6px}
.obj .meta{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--ink-soft)}
.obj .prog{font:600 15px var(--f-mono);margin-top:6px}
.obj .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;border-top:1px solid var(--paper-edge);padding-top:6px}
.obj .st{position:absolute;right:6px;top:34%;pointer-events:none}
.obj.dark,.obj.withdrawn,.obj.unusable{filter:saturate(.15);transform:translateY(2px) rotate(-1deg);box-shadow:0 1px 0 var(--paper-edge),0 1px 2px rgba(26,23,20,.12)}
.obj.sink{animation:sink .5s ease-out both}
@keyframes sink{from{filter:saturate(1);transform:rotate(-2deg)}}
.obj.lift{animation:lift .5s ease-out both}
@keyframes lift{0%{transform:rotate(-2deg)}40%{transform:translateY(-6px) rotate(-1deg) scale(1.02)}100%{transform:rotate(-2deg)}}
.stamp.slam{animation:slam .18s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes slam{from{transform:scale(1.6) rotate(-8deg);opacity:0}to{transform:rotate(-8deg);opacity:.8}}
.calchip{font:600 10px var(--f-narrow);border:1px solid currentColor;padding:1px 4px;border-radius:2px}
.calchip.on{color:var(--teal-ink)} .calchip.offc{color:var(--ochre-ink)}
.risk{font:600 10.5px var(--f-narrow);color:var(--ochre-ink)}
.code{font:600 10px var(--f-mono);display:inline-grid;place-items:center;width:22px;height:16px;border:1px solid var(--ink);border-radius:2px;margin-right:4px}
.fan{display:flex;height:22px;margin-top:6px;padding-left:2px}
.fan i{width:16px;height:20px;margin-left:-9px;background:var(--paper);border:1px solid var(--ink-soft);border-radius:1px;box-shadow:0 1px 1px rgba(26,23,20,.2)}
.fan i:first-child{margin-left:0}
.fan i:nth-child(odd){transform:rotate(-6deg)} .fan i:nth-child(even){transform:rotate(5deg)}
.fan i.done{background:var(--teal);border-color:var(--teal)}

/* recorder magazine */
.recorder{text-align:center}
.mag{width:64px;margin:6px auto 4px;height:250px;background:var(--paper-deep);border-radius:4px;position:relative;padding:4px;display:flex;flex-direction:column-reverse;gap:1px;overflow:hidden;
  box-shadow:inset 0 2px 4px rgba(26,23,20,.3),inset 0 -1px 0 rgba(255,255,255,.5),0 0 0 1px var(--paper-edge)}
.mag .chit{flex:none;border-radius:1px;background:var(--paper);box-shadow:0 0 0 .5px rgba(26,23,20,.45);display:flex;align-items:center;justify-content:center;font:600 7px var(--f-mono);color:var(--ink-soft);overflow:hidden}
.mag .chit.pk{background:repeating-linear-gradient(90deg,var(--paper) 0 3px,var(--paper-edge) 3px 4px)}
.mag .chit.new{animation:chitin .25s ease-out both}
@keyframes chitin{from{transform:translateX(-30px) rotate(-12deg);opacity:0}}
.mag .steps{position:absolute;left:0;right:0;border-top:1px dashed rgba(26,23,20,.3);pointer-events:none}
.flutter{position:absolute;left:50%;bottom:-6px;width:24px;height:18px;background:var(--paper);border:1px solid var(--red);margin-left:-12px;animation:flutter .7s ease-in forwards;pointer-events:none}
@keyframes flutter{to{transform:translate(var(--dx),120px) rotate(25deg);opacity:0}}
.recorder .cap{font:600 13px var(--f-mono)}

/* seats */
.seats{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.seat{background:var(--paper);padding:10px 10px 10px;box-shadow:inset 0 0 0 1px var(--paper-edge);position:relative;border-top:3px solid var(--ink)}
.seat h3{font:400 13px var(--f-display);letter-spacing:.03em;display:flex;justify-content:space-between;align-items:baseline}
.seat h3 small{font:600 11px var(--f-mono);color:var(--ink-soft)}
.advice{font-size:11.5px;color:var(--ink-soft);min-height:32px;margin:4px 0 8px;line-height:1.35}
.strip{display:flex;flex-direction:column;gap:6px}
.actbtn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;text-align:left;background:var(--paper);border:1px solid var(--ink);border-radius:2px;padding:7px 8px 6px;cursor:pointer;
  box-shadow:2px 2px 0 var(--ink);transition:transform .06s}
.actbtn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.actbtn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.actbtn b{font:600 13px/1.1 var(--f-narrow)}
.actbtn .cost{display:flex;gap:2px;align-items:center}
.actbtn .cost i{width:8px;height:8px;border-radius:50%;background:var(--ink)}
.actbtn .why{grid-column:1/-1;font-size:10.5px;line-height:1.3;color:var(--ink-soft)}
.actbtn[aria-disabled="true"]{border-color:var(--paper-edge);box-shadow:none;cursor:not-allowed;transform:none;background:transparent}
.actbtn[aria-disabled="true"] b{color:var(--ink-soft)}
.actbtn[aria-disabled="true"] .cost i{background:var(--paper-edge)}
.endweek{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border-top:1px solid var(--paper-edge);padding-top:14px}

/* bottom matter */
.bottom{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px 44px;align-items:start}
.legend{border:1px solid var(--ink);padding:10px 12px;font-size:11.5px;line-height:1.35}
.legend h3{font:400 12px var(--f-display);letter-spacing:.04em;border-bottom:1px solid var(--ink);padding-bottom:4px;margin-bottom:6px}
.legend table{border-collapse:collapse;width:100%}
.legend td{border-bottom:1px solid var(--paper-edge);padding:4px 6px 4px 0;vertical-align:middle}
.legend tr:last-child td{border-bottom:0}
.lgw{width:26px;height:19px;border-radius:2px;display:inline-block;background:var(--paper-deep);box-shadow:inset 0 1px 2px rgba(26,23,20,.26);position:relative;vertical-align:middle}
.log{border-left:1px solid var(--paper-edge);padding-left:14px;max-height:240px;overflow:auto}
.log h3{font:600 14px var(--f-narrow);margin-bottom:6px}
.log ol{list-style:none;margin:0;padding:0;font:400 11.5px/1.45 var(--f-mono)}
.log li{padding:3px 0;border-bottom:1px dotted var(--paper-edge)}
.log li.k-bad{color:var(--red-ink)} .log li.k-good{color:var(--teal-ink)} .log li.k-warn{color:var(--ochre-ink)} .log li.k-event{font-weight:600}
.netstrip{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:5px 0;font:400 10px var(--f-mono)}
.netstrip b{font-weight:600}
.netstrip .LIVE{color:var(--teal-ink)} .netstrip .CACHED{color:var(--ochre-ink)} .netstrip .CUT{color:var(--ink-soft)}
.boardfoot{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}

/* safe mode frame */
.safeframe{position:absolute;inset:8px;pointer-events:none;z-index:4;overflow:visible}
.safeframe rect{fill:none;stroke:var(--red);stroke-width:1.5;stroke-dasharray:6000;stroke-dashoffset:6000;animation:draw 1.2s ease-out forwards,pulse 2.4s 1.2s ease-in-out 1}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{50%{stroke-width:4;opacity:.6}}

/* negotiation */
.wash{position:fixed;inset:0;background:rgba(66,44,24,.42);z-index:50;animation:fade .3s ease-out both}
@keyframes fade{from{opacity:0}}
.nego{position:fixed;left:50%;bottom:0;width:min(440px,calc(100vw - 24px));z-index:70;transform:translateX(-50%) rotate(1deg);margin-bottom:max(14px,env(safe-area-inset-bottom,0px));
  padding:16px 18px 14px;border-top:6px solid var(--ochre);max-height:calc(100vh - 40px);overflow:auto}
.nego.enter{animation:slideup .38s cubic-bezier(.17,.84,.44,1) both}
.nego.leave{animation:slidedown .3s ease-in both}
@keyframes slideup{from{transform:translateX(-50%) translateY(110%) rotate(1deg)}}
@keyframes slidedown{to{transform:translateX(-50%) translateY(110%) rotate(1deg)}}
.nego h2{font:400 20px/1.1 var(--f-display);margin:4px 0 6px}
.nego p{font-size:13px}
.opts{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;background:var(--paper);border:1px solid var(--ink);padding:8px 10px;cursor:pointer;border-radius:2px;box-shadow:2px 2px 0 var(--ink)}
.opt b{font:600 14px var(--f-narrow)}
.opt span{grid-column:1/-1;font-size:12px;color:var(--ink-soft)}
.opt:hover{background:var(--paper-deep)}
.opt[aria-disabled="true"]{cursor:not-allowed;box-shadow:none;border-style:dashed;border-color:var(--ink-soft);background:transparent}
.opt.refuse b{text-decoration:line-through;color:var(--ink-soft)}
.opt.refuse span{color:var(--red-ink)}

/* prep */
.prep{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:30px;align-items:start}
.form{padding:22px 24px 20px}
.form h2{font:400 22px var(--f-display);letter-spacing:.02em}
.formno{display:flex;justify-content:space-between;font:400 10px var(--f-mono);color:var(--ink-soft);border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:14px}
.classtabs{display:flex;gap:0;margin:6px 0 18px;flex-wrap:wrap}
.classtabs label{position:relative;cursor:pointer}
.classtabs input{position:absolute;opacity:0;inset:0}
.classtabs span{display:block;padding:9px 14px 8px;border:1px solid var(--ink);margin-right:-1px;background:var(--paper);font:400 13px var(--f-display);letter-spacing:.02em}
.classtabs small{display:block;font:400 10px var(--f-mono);color:var(--ink-soft);letter-spacing:0;margin-top:2px}
.classtabs input:checked+span{background:var(--ink);color:var(--paper)}
.classtabs input:checked+span small{color:var(--paper-edge)}
.classtabs input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
fieldset{border:0;padding:0;margin:0 0 16px}
legend{font:600 14px var(--f-narrow);padding:0;margin-bottom:4px}
.orow{display:grid;grid-template-columns:24px minmax(0,1fr) 70px 70px;gap:8px;align-items:center;border-bottom:1px solid var(--paper-edge);padding:6px 0;cursor:pointer;font-size:13.5px}
.orow input{position:absolute;opacity:0;width:1px;height:1px}
.box{width:17px;height:17px;border:1.5px solid var(--ink);display:grid;place-items:center;background:var(--paper)}
.orow input[type=radio]+.box{border-radius:50%}
.orow input:checked+.box::after{content:"";width:9px;height:9px;background:var(--ink)}
.orow input[type=checkbox]:checked+.box::after{width:11px;height:6px;background:none;border-left:2.5px solid var(--red);border-bottom:2.5px solid var(--red);transform:rotate(-48deg) translate(1px,-1px)}
.orow input[type=radio]:checked+.box::after{border-radius:50%}
.orow input:focus-visible+.box{outline:2px solid var(--blue);outline-offset:2px}
.orow .nm small{display:block;font-size:11px;color:var(--ink-soft)}
.orow .c{text-align:right;font:400 13px var(--f-mono)}
.ohead{display:grid;grid-template-columns:24px minmax(0,1fr) 70px 70px;gap:8px;font:600 11px var(--f-narrow);color:var(--ink-soft);border-bottom:1px solid var(--ink);padding-bottom:3px}
.ohead span:nth-child(n+3){text-align:right}
.recsteps{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.recsteps label{position:relative;cursor:pointer}
.recsteps input{position:absolute;opacity:0;inset:0}
.recsteps span{display:grid;place-items:center;width:38px;height:32px;border:1px solid var(--ink);font:600 13px var(--f-mono);background:var(--paper)}
.recsteps input:checked+span{background:var(--ink);color:var(--paper)}
.recsteps input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.subtotal{display:flex;justify-content:flex-end;margin-top:12px}
.subtotal>div{border:2px solid var(--ink);padding:8px 12px;min-width:220px;font-size:13px}
.subtotal .row{display:flex;justify-content:space-between;gap:12px}
.subtotal .tot{border-top:1px solid var(--ink);margin-top:4px;padding-top:4px;font-weight:600}
.over{color:var(--red-ink)}
.presets{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;font:600 12px var(--f-narrow)}
.dossier{padding:18px 18px 16px;transform:rotate(1.2deg)}
.dossier h2{font:400 18px var(--f-display);letter-spacing:.02em}
.plate{margin:12px 0 10px;position:relative;background:var(--paper-deep);aspect-ratio:4/3;max-width:100%;overflow:hidden;box-shadow:inset 0 0 0 1px var(--paper-edge)}
.plate img,.plate svg{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.35) contrast(1.08) sepia(.12)}
.plate::after{content:"";position:absolute;inset:5px;border:1px solid var(--paper-edge);pointer-events:none}
.plate figcaption{position:absolute;left:8px;bottom:8px;right:8px;font:400 9.5px var(--f-mono);background:var(--paper);padding:2px 5px;opacity:.92}
.manifest{width:100%;border-collapse:collapse;font-size:12.5px}
.manifest td{border-bottom:1px solid var(--paper-edge);padding:4px 0}
.manifest td:last-child{text-align:right}
.gauge{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center;margin:12px 0}
.gauge p{font-size:12.5px}
.problems{margin:10px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--red-ink)}
.unlocked{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mini{font:600 11px var(--f-narrow);padding:3px 6px;background:var(--paper);box-shadow:0 0 0 1px var(--ink-soft)}
.stretch{margin-top:10px;font-size:12px}
.stretch select{font:inherit;background:var(--paper);border:1px solid var(--ink);padding:3px}

/* robot card deck */
.deckset{overflow-x:clip;min-width:0}
.deck{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center;gap:6px;margin:6px 0 4px}
.deck-stage{position:relative;display:flex;justify-content:center;padding:14px 0 18px;touch-action:pan-y}
.deck-stage .ghost{position:absolute;top:22px;bottom:22px;width:min(270px,82%);left:50%;margin-left:min(-135px,-41%);border-radius:2px;background:var(--paper);
  box-shadow:0 1px 0 var(--paper-edge),0 2px 3px rgba(26,23,20,.14)}
.deck-stage .ghost.g1{transform:rotate(4deg) translateX(10px)} .deck-stage .ghost.g2{transform:rotate(-5deg) translateX(-8px)}
.rcard{width:min(280px,100%);padding:12px 13px 12px;position:relative;z-index:2;transform:rotate(-1.2deg);font-size:12.5px;line-height:1.4;min-height:430px;display:flex;flex-direction:column}
.rcard.picked{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 2px var(--teal),0 2px 3px rgba(26,23,20,.14),0 10px 22px -8px rgba(26,23,20,.3)}
.rcard .plate{margin:8px 0 8px;aspect-ratio:4/3}
.rcard h3{font:400 18px/1.1 var(--f-display);letter-spacing:.01em}
.rcard .realname{font:600 12px var(--f-narrow);color:var(--ink-soft);margin-top:2px}
.rcard .stats{width:100%;border-collapse:collapse;margin-top:8px}
.rcard .stats td{border-bottom:1px solid var(--paper-edge);padding:3px 0}
.rcard .stats td:last-child{text-align:right}
.rcard .cardacts{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.rcard .facts{margin:8px 0 0;padding-left:18px}
.rcard .facts li{margin-bottom:6px}
.rcard .plays{border-top:2px solid var(--ink);margin-top:8px;padding-top:6px}
.rcard .picked-stamp{position:absolute;right:10px;top:46px;z-index:3;font-size:13px}
.rcard .picked-stamp.on-back{top:auto;bottom:62px;right:14px}
.rcard.in-next{animation:cardnext .32s cubic-bezier(.17,.84,.44,1) both}
.rcard.in-prev{animation:cardprev .32s cubic-bezier(.17,.84,.44,1) both}
.rcard.flip{animation:cardflip .3s ease-out both}
@keyframes cardnext{from{transform:translateX(70px) rotate(8deg);opacity:0}}
@keyframes cardprev{from{transform:translateX(-70px) rotate(-8deg);opacity:0}}
@keyframes cardflip{from{transform:perspective(900px) rotateY(88deg)}to{transform:perspective(900px) rotate(-1.2deg)}}
.deck-nav{width:40px;height:40px;border-radius:50%;border:1px solid var(--ink);background:var(--paper);font:400 18px/1 var(--f-display);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.deck-nav:active{transform:translate(2px,2px);box-shadow:none}
.deck-pips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
.deck-pip{font:600 10px var(--f-mono);min-width:44px;padding:4px 6px;border:1px solid var(--ink-soft);background:var(--paper);cursor:pointer;border-radius:2px;color:var(--ink-soft)}
.deck-pip.cur{border-color:var(--ink);color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.deck-pip.on{background:var(--teal);border-color:var(--teal);color:var(--paper)}
.deck-hint{text-align:center;font-size:11.5px;color:var(--ink-soft)}

/* guidance: briefing card, highlight, week report */
.tour{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:min(350px,calc(100vw - 32px));z-index:90;
  padding:12px 14px 12px;border-top:5px solid var(--blue);transform:rotate(-.6deg)}
.tour.right{left:auto;right:max(16px,env(safe-area-inset-right,0px))}
.tour.top{top:max(16px,env(safe-area-inset-top,0px));bottom:auto}
.tour h2{font:400 17px/1.15 var(--f-display);margin:4px 0 6px}
.tour p{font-size:13px;line-height:1.45}
.tour .cardhead{color:var(--blue)}
.tour-acts{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.tour-hl{outline:3px solid var(--blue)!important;outline-offset:5px;border-radius:3px;scroll-margin-top:24px}
.tour.in{animation:tourin .3s cubic-bezier(.17,.84,.44,1) both}
@keyframes tourin{from{transform:translateY(24px) rotate(-.6deg);opacity:0}}
.wreport{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));z-index:85;
  padding:12px 15px 12px;border-top:5px solid var(--ink);transform:rotate(.7deg);animation:tourin .35s cubic-bezier(.17,.84,.44,1) both}
.wreport h2{font:400 17px var(--f-display);margin:4px 0 6px}
.wreport ul{margin:0;padding-left:18px;font-size:13px;line-height:1.45}
.wreport li{margin-bottom:5px}
.wreport li.bad{color:var(--red-ink)} .wreport li.good{color:var(--teal-ink)} .wreport li.warn{color:var(--ochre-ink)}
.wreport .tour-acts{margin-top:8px}
@media (max-width:700px){ .tour-hl{scroll-margin-top:210px} .tour{top:max(10px,env(safe-area-inset-top,0px));bottom:auto} .tour.top{top:auto;bottom:10px} .wreport{bottom:10px} }

/* glossary tooltip */
abbr[data-g],.tg,.token,.code,.gw,.wkdl abbr{cursor:help}
abbr[data-g]{text-decoration:underline dotted;text-decoration-color:var(--ink-soft);text-underline-offset:2px}
.gloss{position:fixed;z-index:120;max-width:min(300px,calc(100vw - 24px));background:var(--paper);border:1.5px solid var(--ink);border-radius:2px;padding:7px 10px 8px;
  font-size:12.5px;line-height:1.4;color:var(--ink);box-shadow:3px 3px 0 var(--ink);pointer-events:none}
.gloss b{display:block;font:600 13px var(--f-narrow);margin-bottom:1px}
.glossary{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:13.5px;max-width:80ch}
.glossary dt{font:600 13px var(--f-mono);white-space:nowrap}
.glossary dd{margin:0;border-bottom:1px solid var(--paper-edge);padding-bottom:4px}

/* ---------- printed cards: artwork from the card set, every number from the game ---------- */
.pcard{container-type:inline-size;position:relative;display:block;width:100%;aspect-ratio:5/7;background:var(--paper);border-radius:2px;overflow:hidden;color:var(--ink);text-align:left;font-size:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 0 var(--paper-edge),0 2px 3px rgba(26,23,20,.16),0 10px 22px -10px rgba(26,23,20,.3)}
.pcard *{box-sizing:border-box}
.pcard::before{content:"";position:absolute;left:0;right:0;top:0;height:1.3cqw;background:var(--cc,var(--ink));z-index:1}
.pcard::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:var(--grain);opacity:.06;mix-blend-mode:multiply}
.pcard[data-c="red"]{--cc:var(--red-ink)} .pcard[data-c="blue"]{--cc:var(--blue)} .pcard[data-c="ochre"]{--cc:var(--ochre-ink)} .pcard[data-c="teal"]{--cc:var(--teal-ink)} .pcard[data-c="ink"]{--cc:var(--ink)}
.pcard .reg{position:absolute;width:4.6cqw;height:4.6cqw;color:var(--paper-edge)}
.pcard .reg.tl{left:1.1cqw;top:1.9cqw}.pcard .reg.tr{right:1.1cqw;top:1.9cqw;left:auto}.pcard .reg.bl{left:1.1cqw;bottom:1.1cqw;top:auto}.pcard .reg.br{right:1.1cqw;bottom:1.1cqw;top:auto;left:auto}
.pc-in{position:absolute;inset:4.3cqw;border:1px solid var(--paper-edge);padding:2cqw 2.6cqw 1.8cqw;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pc-head{display:flex;justify-content:space-between;align-items:baseline;gap:2cqw;border-bottom:.3cqw solid var(--ink);padding-bottom:1.6cqw}
.pc-cat{font:600 3cqw/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--cc,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-code{font:400 2.6cqw/1 var(--f-mono);color:var(--ink-soft);white-space:nowrap}
.pc-title{margin:0;font:400 5.7cqw/1.08 var(--f-display);letter-spacing:.01em;height:12.8cqw;display:flex;align-items:flex-end;padding-bottom:1.3cqw;text-wrap:balance}
.pc-art{flex:none;aspect-ratio:654/382;background:var(--paper-deep);box-shadow:inset 0 0 0 .25cqw var(--paper-edge);overflow:hidden;position:relative}
.pc-art img,.pc-art svg{display:block;width:100%;height:100%;object-fit:cover}
.pc-art img.photo{filter:grayscale(.35) contrast(1.08) sepia(.12)}
.pc-stats{margin:2cqw 0 0;padding:0}
.pc-stats>div{display:flex;justify-content:space-between;align-items:baseline;gap:2cqw;border-bottom:.25cqw solid var(--paper-edge);padding:.9cqw 0}
.pc-stats dt{font:600 3cqw/1 var(--f-narrow);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap}
.pc-stats dd{margin:0;font:600 3.8cqw/1.1 var(--f-mono);text-align:right}
.pcard .tg{font-size:max(7px,2.3cqw)}
.pc-rule{margin:2.2cqw 0 0;font:400 3.5cqw/1.4 var(--f-body)}
.pc-fix{margin:1.5cqw 0 0;font:600 3.3cqw/1.35 var(--f-body)}
.pc-fix.fix{color:var(--teal-ink)} .pc-fix.none,.pc-fix.good{color:var(--ink-soft)}
.pc-real{margin:auto 0 0;padding-top:1.5cqw;border-top:.25cqw solid var(--paper-edge);font:italic 400 3cqw/1.38 var(--f-body);color:var(--blue)}
.pc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:1.6cqw;flex:none}
.pc-foot i{display:block;width:9cqw;height:.5cqw;background:var(--cc,var(--ink))}
.pc-foot span{font:400 2.4cqw/1 var(--f-mono);letter-spacing:.08em;color:var(--ink-soft)}
.pc-facts{margin:2cqw 0 0;padding-left:4.2cqw;font:400 3.4cqw/1.35 var(--f-body)}
.pc-facts li{margin-bottom:1.1cqw}
/* small cards on the order-form shelves: art, title and the key numbers only */
@container (max-width:215px){
  .pc-rule,.pc-fix,.pc-real,.pc-facts{display:none}
  .pc-cat{font-size:4.4cqw;letter-spacing:.12em}.pc-code{font-size:3.8cqw}
  .pc-title{font-size:8cqw;height:19cqw}
  .pc-stats{margin-top:3cqw}
  .pc-stats dt{font-size:4.6cqw}.pc-stats dd{font-size:5.6cqw}
  .pc-stats>div:nth-child(n+3){display:none}
  .pc-foot{margin-top:auto}.pc-foot span{font-size:3.4cqw}
}
.pcback{display:block;width:100%;aspect-ratio:5/7;border-radius:2px;overflow:hidden;background:#1A1714;box-shadow:0 1px 0 rgba(0,0,0,.4),0 2px 4px rgba(26,23,20,.3),0 10px 20px -10px rgba(26,23,20,.5)}
.pcback svg{display:block;width:100%;height:100%}

/* order-form shelves: pick a card, it lifts */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:18px 12px;padding:8px 2px 8px}
.pick{position:relative;display:block;cursor:pointer}
.pick input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:3}
.pick .pcard{transition:transform .18s,box-shadow .18s}
.pick:hover .pcard{transform:translateY(-3px)}
.pick input:checked+.pcard{transform:translateY(-8px) rotate(-1deg);box-shadow:0 0 0 3px var(--teal-ink),0 14px 22px -8px rgba(26,23,20,.4)}
.pick input:focus-visible+.pcard{outline:2px solid var(--blue);outline-offset:4px}
.pstamp{position:absolute;right:4px;top:36%;display:none;z-index:4;font-size:11px;padding:2px 6px;border-width:2px;pointer-events:none}
.pick input:checked~.pstamp{display:inline-block}
.shelf-note{margin:2px 0 8px;font-size:12.5px;max-width:62ch}
fieldset.fs-ship,fieldset.fs-dish,fieldset.fs-band{margin-bottom:10px}

/* robot deck */
.rwrap{position:relative;width:min(300px,100%);transform:rotate(-1.2deg)}
.rwrap.picked .pcard{box-shadow:0 0 0 3px var(--teal-ink),0 14px 24px -8px rgba(26,23,20,.4)}
.rwrap .picked-stamp{position:absolute;right:5%;top:25%;z-index:4;font-size:13px}
.rwrap.in-next{animation:cardnext .32s cubic-bezier(.17,.84,.44,1) both}
.rwrap.in-prev{animation:cardprev .32s cubic-bezier(.17,.84,.44,1) both}
.rwrap.flip{animation:cardflip .3s ease-out both}
.deck-acts{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin:0 0 4px}

/* the event card and its deck on the board */
.evwrap{display:flex;gap:16px;align-items:flex-start;min-width:0}
.evdeck{position:relative;width:62px;flex:none;margin-top:12px}
.evdeck::before,.evdeck::after{content:"";position:absolute;inset:0;background:#2A241F;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.evdeck::before{transform:translate(4px,4px)}.evdeck::after{transform:translate(8px,8px)}
.evdeck .pcback{position:relative;z-index:2}
.evdeck small{position:absolute;left:-6px;right:-6px;top:calc(100% + 16px);text-align:center;font:600 10.5px/1.2 var(--f-mono);color:var(--ink-soft)}
.evcard{flex:1 1 auto;width:min(236px,100%);max-width:236px;transform:rotate(-2.5deg);min-width:0}
.evcard.deal{animation:evdeal .55s cubic-bezier(.17,.84,.44,1) both}
@keyframes evdeal{from{transform:translate(-120px,10px) rotateY(88deg) scale(.7);opacity:0}55%{opacity:1}to{transform:rotate(-2.5deg)}}
.cruise .evcard{max-width:250px}

/* objective thumbnails and top bar */
.obj{border-top:4px solid var(--teal-ink)}
.obj-art{height:64px;margin:3px 0 7px;background:var(--paper-deep) var(--art) center/cover no-repeat;box-shadow:inset 0 0 0 1px var(--paper-edge);border-radius:1px}

/* crew */
.avatar{display:inline-block;width:36px;height:36px;border-radius:50%;overflow:hidden;flex:none;background:var(--paper-deep);box-shadow:inset 0 0 0 1.5px var(--ink),0 1px 2px rgba(26,23,20,.3)}
.avatar svg{display:block;width:100%;height:100%}
.seat h3{align-items:center!important;gap:9px}
.seat h3 .sn{flex:1;min-width:0;line-height:1.1}
.seat h3 .who{display:block;font:600 11px/1.1 var(--f-narrow);letter-spacing:0;color:var(--ink-soft);margin-top:3px}

/* card gallery */
.card-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:28px 22px;padding:8px 4px 28px}
.gcard{background:none;border:0;padding:0;cursor:zoom-in;display:block;text-align:left;transition:transform .15s}
.gcard:hover{transform:translateY(-5px) rotate(-.8deg)}
.gcard:focus-visible{outline:2px solid var(--blue);outline-offset:5px}
.zoomwash{position:fixed;inset:0;z-index:140;background:rgba(66,44,24,.6);display:grid;place-items:center;padding:16px;cursor:zoom-out;overflow:auto}
.zoomcard{position:relative;width:min(420px,88vw);cursor:default}
.zoomcard .pcard{transform:rotate(-1deg)}
.zoomx{position:absolute;left:50%;transform:translateX(-50%);bottom:-52px}

/* title: a fan of real cards */
.titlefan{position:relative;width:min(540px,100%);aspect-ratio:1/.94;justify-self:end}
.titlefan .tf{position:absolute;width:41%;top:8%;transition:transform .25s}
.tf1{left:0;transform:rotate(-15deg) translateY(9%);z-index:1}.tf2{left:14%;transform:rotate(-7.5deg) translateY(2%);z-index:2}.tf3{left:29.5%;z-index:5}.tf4{left:44%;transform:rotate(7.5deg) translateY(2%);z-index:3}.tf5{left:58.5%;transform:rotate(15deg) translateY(9%);z-index:2}
.tf3:hover{transform:translateY(-8px)}
@media (max-width:900px){.titlefan{justify-self:center;max-width:440px}}
@media (max-width:560px){.evdeck{display:none}.evcard{max-width:none}.cardgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 14px}.shelf{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}}
@media (prefers-reduced-motion:reduce){.evcard.deal{animation:none}}

/* mid-size cards (phone event card, gallery on small screens): slightly larger text */
@container (min-width:216px) and (max-width:310px){
  .pc-rule{font-size:4.1cqw}.pc-fix{font-size:3.8cqw}.pc-real{font-size:3.4cqw}
  .pc-stats dd{font-size:4.4cqw}.pc-stats dt{font-size:3.5cqw}.pc-facts{font-size:3.9cqw}
}
.obj-art{background-size:contain;background-repeat:no-repeat;background-position:center;height:58px}
.title-frame{overflow-x:clip}
/* drawing the weekly event card */
.evdeck.drawable{background:none;border:0;padding:0;cursor:pointer;display:block;width:80px;animation:deckhint 1.8s ease-in-out infinite;font:inherit;color:inherit}
.evdeck.drawable:hover,.evdeck.drawable:focus-visible{animation:none;transform:translateY(-6px)}
.evdeck.drawable:focus-visible{outline:2px solid var(--blue);outline-offset:6px}
@keyframes deckhint{50%{transform:translateY(-5px)}}
.evslot{flex:1 1 auto;width:min(236px,100%);max-width:236px;min-width:0}
.evslot-box{aspect-ratio:5/7;border:2px dashed var(--ink-soft);border-radius:3px;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:14px;font-size:13px;line-height:1.4;background:rgba(231,224,207,.55)}
.evslot-box p{margin:0}
.evslot-box .tab{white-space:normal;max-width:100%}
@media (prefers-reduced-motion:reduce){.evdeck.drawable{animation:none}}

/* cruise */
.cruise{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:28px;align-items:center}
.cruise svg{width:100%;height:auto}

/* debrief & documents */
.report{padding:28px 30px 24px;max-width:1000px;margin:0 auto}
.report h1{font:400 clamp(26px,4vw,40px)/1 var(--f-display)}
.ledger{width:100%;border-collapse:collapse;margin:18px 0;font-size:13.5px}
.ledger th{text-align:left;font:600 12px var(--f-narrow);color:var(--ink-soft);border-bottom:2px solid var(--ink);padding:4px 8px 4px 0}
.ledger td{border-bottom:1px solid var(--paper-edge);padding:9px 8px 9px 0;vertical-align:middle}
.ledger td.n{font-family:var(--f-mono);text-align:right}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0}
.fig{border:2px solid var(--ink);padding:10px 12px}
.fig b{display:block;font:600 34px/1 var(--f-mono)}
.fig span{font:600 12px var(--f-narrow);color:var(--ink-soft)}
.bars{width:100%;height:auto;margin-top:6px}
.galileo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;border-top:2px solid var(--ink);margin-top:18px;padding-top:16px}
.closing{font:400 clamp(22px,3.4vw,34px)/1.1 var(--f-display);margin:22px 0 8px}
.closing em{font-style:normal;color:var(--red-ink)}
.doc{padding:26px 28px;max-width:1080px;margin:0 auto}
.doc h1{font:400 clamp(24px,3.4vw,34px) var(--f-display)}
.doc h2{font:600 18px var(--f-narrow);margin:22px 0 8px;border-bottom:1px solid var(--ink);padding-bottom:3px}
.doc p,.doc li{max-width:72ch;font-size:14px}
.doc ul,.doc ol{padding-left:20px}
.tablewrap{overflow-x:auto}
.src{border-collapse:collapse;width:100%;font-size:12.5px;min-width:700px}
.src th{text-align:left;font:600 12px var(--f-narrow);border-bottom:2px solid var(--ink);padding:4px 10px 4px 0}
.src td{border-bottom:1px solid var(--paper-edge);padding:6px 10px 6px 0;vertical-align:top}
.src td:first-child{font-family:var(--f-mono);white-space:nowrap}
.copybox{width:100%;min-height:120px;font:400 11px var(--f-mono);margin-top:8px;background:var(--paper);border:1px solid var(--ink)}
.blankscreen{position:fixed;inset:0;background:var(--ink);z-index:200;color:var(--paper-edge);display:grid;place-items:center;text-align:center;font:600 14px var(--f-narrow)}
.blankscreen button{margin-top:12px}

@media (max-width:900px){
  .board-grid,.prep,.cruise,.title-frame,.bottom,.galileo{grid-template-columns:minmax(0,1fr)}
  .board::before{display:none}
  .seats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .b-head{grid-template-columns:minmax(0,1fr)}
  .dish-art{justify-self:center;max-width:360px}
  .log{border-left:0;padding-left:0}
}
@media (max-width:560px){
  .board{padding:24px 14px 18px}
  .seats{grid-template-columns:minmax(0,1fr)}
  .mission-row{grid-template-columns:minmax(0,1fr) 76px}
  .figs{grid-template-columns:minmax(0,1fr)}
  .wk{width:22px;height:22px;font-size:9px}.marker span{width:28px;height:28px;font-size:10px}
  .wkdate{display:none}
  .well{width:38px;height:30px}.token{width:26px;height:26px;line-height:26px}
  .cxrow{grid-template-columns:70px minmax(0,1fr)}
  .orow,.ohead{grid-template-columns:22px minmax(0,1fr) 54px 54px}
  .deck{grid-template-columns:minmax(0,1fr) minmax(0,1fr);row-gap:2px}
  .deck-stage{grid-column:1/-1;grid-row:1}
  .deck-nav{grid-row:2;justify-self:center}
  .form{padding:18px 14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:1ms!important}
}

  const EVENT_POOL = ['goldstone', 'artemis', 'conjunction', 'wheel', 'safe', 'dust', 'wheeldmg', 'calbroken', 'memory', 'budget', 'extended', 'target', 'closest', 'rival'];

  const ACTIONS = {
    ret:        { seat: 'explorer',   name: 'Return',            cost: 1 },
    collect:    { seat: 'explorer',   name: 'Collect Data',      cost: 2 },
    explore:    { seat: 'explorer',   name: 'Explore Further',   cost: null },
    calibrate:  { seat: 'researcher', name: 'Calibrate',         cost: 1 },
    analyse:    { seat: 'researcher', name: 'Analyse',           cost: 2 },
    upload:     { seat: 'researcher', name: 'Upload',            cost: 3 },
    repair:     { seat: 'engineer',   name: 'Repair',            cost: 1 },
    service:    { seat: 'engineer',   name: 'Service Robots',    cost: 2 },
    command:    { seat: 'engineer',   name: 'Command Robots',    cost: 3 },
    standdown:  { seat: 'director',   name: 'Stand Down',        cost: 1 },
    request:    { seat: 'director',   name: 'Request Slots',     cost: 2 },
    commandeer: { seat: 'director',   name: 'Commandeer',        cost: 3 }
  };
  const SEATS = [
    { id: 'explorer', name: 'Explorer', acts: ['ret', 'collect', 'explore'] },
    { id: 'researcher', name: 'Researcher', acts: ['calibrate', 'analyse', 'upload'] },
    { id: 'engineer', name: 'Engineer', acts: ['repair', 'service', 'command'] },
    { id: 'director', name: 'Flight Director', acts: ['standdown', 'request', 'commandeer'] }

  // ---------- rng ----------
  function rand(s) { // mulberry32, state kept in s.rng

  const clone = o => JSON.parse(JSON.stringify(o));

  // ---------- build ----------
  function newBuild() { return { cls: 'flagship', ship: 'medium', robots: [], dish: 'd30', band: 'Ka', rec: 2, target: null }; }
  function buildCost(b) {

    b.robots.forEach(r => c += ROBOTS[r].cost);
    return c;
  }
  const buildMass = b => b.robots.reduce((m, r) => m + ROBOTS[r].mass, 0);
  function buildProblems(b) {
    const p = [];
    if (!b.robots.length) p.push('Fly at least one science robot.');
    if (b.rec < 1) p.push('Fly at least one recorder step.');
    if (buildCost(b) > CLASSES[b.cls].budget) p.push(`Over budget: ${buildCost(b)} of ${CLASSES[b.cls].budget} units.`);
    if (buildMass(b) > SHIPS[b.ship].cap) p.push(`Over mass: ${buildMass(b)} kg on a ${SHIPS[b.ship].cap} kg stage.`);
    return p;
  }

  function distanceFactors(horizonRows) {
    if (!horizonRows || horizonRows.length < 12) return { df: DF_DEFAULT.slice(), src: 'default' };
    const d = horizonRows.slice(0, 12).map(r => r.deltaAU);
    const dmin = Math.min(...d);
    // DERIVED: inverse-square on the real Horizons range. Overstates the swing — real missions adapt coding.
    return { df: d.map(x => +Math.pow(dmin / x, TUNE.dfExp).toFixed(3)), src: 'horizons', dates: horizonRows.slice(0, 12).map(r => r.date), au: d };
  }

  // ---------- new game ----------
  function newGame(build, opts = {}) {
    const s = {
      seed: opts.seed ?? ((Math.random() * 2 ** 31) | 0), rng: 0,
      build: clone(build), phase: 'ops', week: 1, pool: BASE_AP, carry: 0, spentBySeat: {},
      df: opts.df || DF_DEFAULT.slice(), dfSrc: opts.dfSrc || 'default', dates: opts.dates || null,
      objectives: [], focus: null, rec: {}, packed: {}, depth: 0, stuck: false,
      goodwill: 1, tradeNext: 0, wells: [], conflict: null,
      flags: {}, persist: { wheel: false, safe: false, calBroken: false, wheelDmg: false, rivalsGone: 0 },
      deck: [], event: null, flare: opts.flare || null, autoDraw: opts.autoDraw !== false, drawn: true,
      stats: { requested: 0, granted: 0, overflow: 0, generated: 0, delivered: 0, lostCal: 0, withdrawn: 0, conflicts: 0 },
      log: [], fx: [], history: []
    };
    s.rng = s.seed;
    const tags = build.robots.map(r => ROBOTS[r].tag);
    OBJECTIVES.filter(o => tags.includes(o.tag)).forEach(o => {
      s.objectives.push({ ...o, delivered: 0, calibrated: false, status: 'live', resolvedWeek: null });
      s.rec[o.id] = 0; s.packed[o.id] = 0;
    });

    // deck: 12 of the 14 printed cards, safe + conjunction never in weeks 1–2
    let d;
    do { d = shuffle(s, EVENT_POOL).slice(0, 12); } while (['safe', 'conjunction'].includes(d[0]) || ['safe', 'conjunction'].includes(d[1]));

    startWeek(s);
    say(s, 'Orbit insertion complete. The recorder is empty until the robots report at the end of week 1.', 'good');
    return s;
  }

  // ---------- derived ----------
  function cardsPerSlot(s, w = s.week) {
    const b = s.build;
    let c = Math.max(1, Math.round(4 * DISHES[b.dish].rate * BANDS[b.band].mult * s.df[Math.min(11, w - 1)]));

  }
  const wellCap = (s, w) => w.reduced ? Math.max(1, Math.floor(cardsPerSlot(s) / 2)) : cardsPerSlot(s);
  const recCap = s => s.build.rec * REC.cards;
  const recUsed = s => Object.keys(s.rec).reduce((t, k) => t + s.rec[k] + s.packed[k], 0);
  const mine = s => s.wells.filter(w => w.holder === 'P7');
  const openSlots = s => mine(s).filter(w => !w.used);
  const downlinkCap = s => openSlots(s).reduce((t, w) => t + wellCap(s, w), 0);
  const live = s => s.objectives.filter(o => o.status === 'live');
  const liveCore = s => s.objectives.filter(o => o.status === 'live' && !o.bonus);
  const maxPoints = s => s.objectives.filter(o => !o.bonus).reduce((t, o) => t + o.pts, 0);
  const hasMobile = s => s.build.robots.some(r => ROBOTS[r].mobile);
  const rivalByCode = c => RIVALS.find(r => r.code === c);

  function say(s, msg, kind = 'info') { s.logN = (s.logN || 0) + 1; s.log.unshift({ w: s.week, msg, kind }); if (s.log.length > 60) s.log.pop(); }
  function fx(s, type, data = {}) { s.fx.push({ type, ...data }); }

  // ---------- week setup ----------
  function startWeek(s) {
    s.flags = {};
    s.event = s.deck[s.week - 1] || 'nominal';
    s.drawn = false;
    buildBoard(s); // the normal schedule; the event card changes it once it is drawn
    fx(s, 'week');
    if (s.autoDraw) applyEvent(s);
    else say(s, `Week ${s.week}. Draw this week’s event card.`, 'event');
  }
  /* Drawing the top card of the face-down deck: its effect lands on all four seats at once. */
  function applyEvent(s) {
    const e = s.event; s.drawn = true;
    const heldBy = () => s.wells.filter(w => w.holder && w.holder !== 'P7');
    if (e === 'goldstone') {
      s.flags.goldstone = true;
      s.wells.filter(w => w.cx === 0).forEach(w => {
        if (w.holder === 'P7') { // a slot traded for last week moves to a free well elsewhere if one exists
          const alt = shuffle(s, s.wells.filter(x => x.cx !== 0 && !x.offline && !x.holder && !x.claim))[0];
          if (alt) alt.holder = 'P7'; else s.stats.granted = Math.max(0, s.stats.granted - 1);
        }
        w.holder = null; w.claim = null; w.offline = true;
      });
      const target = Math.round(((RIVAL_HOLD) - (s.persist.rivalsGone || 0)) * 10 / 15); // rivals scale to the ten wells that remain
      shuffle(s, heldBy()).slice(target).forEach(w => { w.holder = null; });
    }
    if (e === 'artemis') {
      s.flags.artemis = true;
      const target = RIVAL_HOLD_SURGE - (s.persist.rivalsGone || 0);
      const takable = shuffle(s, s.wells.filter(w => !w.offline && !w.holder));
      takable.sort((a, b) => (a.claim ? 1 : 0) - (b.claim ? 1 : 0)); // free wells first, then ones a rival had only claimed
      for (const w of takable) { if (heldBy().length >= target) break; w.holder = w.claim || RIVALS[rint(s, 5)].code; w.claim = null; }
    }
    if (e === 'dust') s.flags.dust = true;
    if (e === 'conjunction') s.flags.conjunction = true;
    if (e === 'budget') { s.pool = Math.max(0, s.pool - 2); }
    if (e === 'wheel') s.persist.wheel = true;
    if (e === 'safe') s.persist.safe = true;
    if (e === 'calbroken') s.persist.calBroken = true;
    if (e === 'wheeldmg') s.persist.wheelDmg = true;
    if (e === 'closest') s.flags.closest = true;
    if (e === 'extended') { s.pool += 3; say(s, 'Extended mission approved: +3 AP.', 'good'); }
    if (e === 'rival') {
      s.persist.rivalsGone = (s.persist.rivalsGone || 0) + 1;

    }

      if (lostM) { s.stats.overflow += lostM; fx(s, 'overflow', { n: lostM }); }

    }

        s.objectives.push({ id: 'bonus', name: 'Target of Opportunity: comet flyby', tag: 'bonus', need: 10, deadline: Math.min(12, s.week + 2), pts: 2, bonus: true, delivered: 0, calibrated: false, status: 'live', resolvedWeek: null });
        s.rec.bonus = 0; s.packed.bonus = 0;
        say(s, `A bonus objective appears: 10 cards home by week ${Math.min(12, s.week + 2)}, worth 2 points. Idle robots feed it.`, 'good');

  function draw(s0) {

    return s;
  }
  function eventTitle(s, e) {

    shuffle(s, avail()).slice(0, hold).forEach((w, k) => { w.holder = RIVALS[(k + rint(s, 5)) % 5].code; });

    const k = TUNE.claimMin + rint(s, TUNE.claimSpan);
    shuffle(s, avail()).slice(0, k).forEach(w => w.claim = RIVALS[rint(s, 5)].code);

  // ---------- legality ----------
  function apCost(s, id) { return id === 'explore' ? (3 + s.depth) * (s.persist.wheelDmg ? 2 : 1) : ACTIONS[id].cost; }
  function canDo(s, id) {
    if (s.phase !== 'ops') return no('The mission is not in operations.');
    if (s.drawn === false) return no('Draw this week’s event card first.');
    if (s.conflict) return no('Resolve the open negotiation first.');
    const c = apCost(s, id);
    if (s.pool < c) return no(`Needs ${c} AP; the pool holds ${s.pool}.`);
    const safe = s.persist.safe, conj = s.flags.conjunction;
    switch (id) {
      case 'ret': if (s.depth === 0 && !s.stuck) return no('Nothing to return from: depth 0, rover free.'); break;
      case 'collect': if (safe) return no('Safe mode: no science until recovered.'); if (s.depth === 0) return no('Explore first — Collect consumes the exploration stack.'); if (!s.focus) return no('No live objective to file data under.'); break;
      case 'explore': if (!hasMobile(s)) return no('No rover or helicopter aboard.'); if (s.flags.dust) return no('Global dust storm: nothing can explore this week.'); if (safe) return no('Safe mode: no science until recovered.'); if (s.stuck) return no('Rover is stuck. Return or Repair to free it.'); break;
      case 'calibrate': if (!s.persist.calBroken && !live(s).some(o => !o.calibrated)) return no('Every live objective already carries calibration.'); break;
      case 'analyse': if (!s.focus || s.rec[s.focus] < 2) return no('Needs at least 2 raw cards on the target objective.'); break;
      case 'upload': if (conj) return no('Solar conjunction: no downlink this week.'); if (safe) return no('Safe mode: no science downlink until recovered.'); if (downlinkCap(s) === 0) return no('No unused granted slots. Request slots first.'); if (recUsed(s) === 0) return no('Recorder is empty.'); break;
      case 'repair': if (!s.stuck && !s.persist.safe && !s.persist.wheelDmg) return no('Nothing to repair.'); if (s.persist.safe && !s.stuck && openSlots(s).length === 0) return no('Safe-mode recovery needs 1 granted slot. Request slots first.'); break;
      case 'service': if (s.persist.wheel && openSlots(s).length === 0) return no('Wheel service needs 1 granted slot.'); if (safe) return no('Recover from safe mode first.'); if (conj && s.persist.wheel) return no('Conjunction: cannot command the service.'); break;
      case 'command': if (safe) return no('Safe mode: no commanding until recovered.'); if (conj) return no('Solar conjunction: no commanding.'); if (openSlots(s).length === 0) return no('Commanding needs 1 granted slot for the uplink.'); if (!s.focus) return no('No live objective to target.'); break;
      case 'standdown': break;
      case 'request': if (TUNE.oneRequest && s.flags.requested) return no('The DSN builds each week’s schedule from one request per mission. Trade or Commandeer for more.'); if (s.wells.every(w => w.offline || w.holder === 'P7')) return no('No wells left to request.'); break;
      case 'commandeer': if (s.goodwill < 1) return no('Commandeer costs 1 goodwill token; you hold none.'); if (!s.wells.some(w => w.holder && w.holder !== 'P7' && !rivalByCode(w.holder).prime)) return no('Only prime missions hold wells; primes cannot be commandeered.'); break;

  }
  function no(why) { return { ok: false, why }; }

  function spend(s, id) {
    const c = apCost(s, id);
    s.pool -= c;
    const seat = ACTIONS[id].seat;
    s.spentBySeat[seat] = (s.spentBySeat[seat] || 0) + c;

  }
  const useSlot = s => { const w = openSlots(s)[0]; if (w) { w.used = true; w.usedFor = 'cmd'; } };

  // ---------- actions: (state, args) -> state ----------
  function act(s0, id, arg) {
    const chk = canDo(s0, id);

    const s = clone(s0); s.fx = [];
    spend(s, id);
    const f = s.objectives.find(o => o.id === s.focus);
    switch (id) {
      case 'ret': s.depth = 0; s.stuck = false; say(s, 'Explorer returned the rover to a safe position. Exploration stack cleared.'); break;
      case 'explore': s.depth++; say(s, `Explorer pushed further: depth ${s.depth}. Next push costs ${apCost(s, 'explore')} AP.`); break;
      case 'collect': { const n = s.depth * COLLECT_PER_DEPTH; s.depth = 0; addCards(s, s.focus, n, 'collect'); break; }
      case 'calibrate':
        if (s.persist.calBroken) { s.persist.calBroken = false; say(s, 'Researcher repaired the calibration pipeline.', 'good'); }

        checkComplete(s); break;
      case 'analyse': {
        const n = Math.min(TUNE.analyseMax, s.rec[s.focus] - (s.rec[s.focus] % 2));
        s.rec[s.focus] -= n; s.packed[s.focus] += n / 2;

      case 'repair':
        if (s.stuck) { s.stuck = false; say(s, 'Engineer freed the stuck rover.', 'good'); }

        else { s.persist.safe = false; useSlot(s); say(s, 'Engineer recovered the spacecraft from safe mode, spending one granted pass.', 'good'); fx(s, 'safeoff'); }
        break;
      case 'service':
        if (s.persist.wheel) { s.persist.wheel = false; useSlot(s); say(s, 'Engineer serviced the reaction wheel. Full yields restored.', 'good'); }
        else { s.flags.service = true; say(s, `Robots serviced: +${SERVICE_BONUS} cards per robot at week's end.`); }
        break;
      case 'command': useSlot(s); addCards(s, s.focus, COMMAND_CARDS, 'command'); break;
      case 'standdown': s.goodwill++; say(s, 'Flight Director stood down a request. +1 goodwill.', 'good'); break;
      case 'request': doRequest(s); break;
      case 'commandeer': {
        s.goodwill--;
        const ws = shuffle(s, s.wells.filter(w => w.holder && w.holder !== 'P7' && !rivalByCode(w.holder).prime)).slice(0, REQUEST);
        const who = [...new Set(ws.map(w => w.holder))].join(', ');
        ws.forEach(w => { w.holder = 'P7'; w.claim = null; fx(s, 'token', { cx: w.cx, i: w.i }); });
        s.stats.requested += REQUEST; s.stats.granted += ws.length;
        say(s, `Commandeered ${ws.length} wells from ${who}. −1 goodwill.`, 'warn'); break;
      }
    }
    return s;
  }

  function addCards(s, oid, n, why) {
    const room = recCap(s) - recUsed(s);
    const put = Math.max(0, Math.min(n, room));
    s.rec[oid] += put; s.stats.generated += n;
    const lost = n - put; s.stats.overflow += lost;
    fx(s, 'chits', { n: put }); if (lost) fx(s, 'overflow', { n: lost });
    const o = s.objectives.find(x => x.id === oid);
    say(s, `${why === 'collect' ? 'Explorer collected' : 'Engineer commanded'} ${n} cards for “${o.name}”${lost ? ` — ${lost} lost, recorder full` : ''}.`, lost ? 'warn' : 'info');
  }

  function doRequest(s) {
    s.flags.requested = true;
    s.stats.requested += REQUEST;
    const free = s.wells.filter(w => !w.offline && !w.holder && !w.claim);
    const got = shuffle(s, free).slice(0, REQUEST);
    got.forEach(w => { w.holder = 'P7'; fx(s, 'token', { cx: w.cx, i: w.i }); });
    s.stats.granted += got.length;
    const short = REQUEST - got.length;
    if (short === 0) { say(s, `Request granted in full: ${got.length} slots.`, 'good'); return; }
    // contested wells: pending claims first, then rival holds
    let pool = s.wells.filter(w => !w.offline && !w.holder && w.claim);
    if (pool.length < short) pool = pool.concat(s.wells.filter(w => !w.offline && w.holder && w.holder !== 'P7'));
    const wells = pool.slice(0, short);
    if (!wells.length) { say(s, `Granted ${got.length}; nothing left to contest.`, 'warn'); return; }

    s.conflict = { short: wells.length, rival, wells: wells.map(w => s.wells.indexOf(w)), got: got.length };

    say(s, `Granted ${got.length}. ${rivalByCode(rival).name} holds the other ${wells.length}. Counter-propose.`, 'warn');
  }

  const CONFLICT_OPTS = {
    split:    { name: 'Split the difference',     desc: s => `Receive ${Math.floor(s.conflict.short / 2)} of ${s.conflict.short} now, full rate.` },
    smaller:  { name: 'Swap to smaller apertures', desc: s => `Receive all ${s.conflict.short} on 34 m-class apertures at half rate.` },
    trade:    { name: 'Trade for next week',       desc: s => `Nothing now; ${s.conflict.short} slot${s.conflict.short === 1 ? '' : 's'} granted automatically next week.` },
    concede:  { name: 'Concede',                   desc: () => 'Nothing now. +1 goodwill token.' },
    goodwill: { name: 'Spend goodwill',            desc: s => `They yield all ${s.conflict.short} in full. −1 token (you hold ${s.goodwill}).` }
  };
  function canResolve(s, opt) {
    if (!s.conflict) return no('No open negotiation.');
    if (opt === 'refuse') return no('A mission that disagrees must counter-propose. Undoing another mission’s proposal is not allowed.');
    if (opt === 'goodwill' && !TUNE.primeYield && rivalByCode(s.conflict.rival).prime) return no('In JPL’s scheduling experiment, prime missions kept 99.9% of their requested time. Goodwill does not move them.');
    if (opt === 'goodwill' && s.goodwill < 1) return no('You hold no goodwill tokens. Stand Down or Concede to earn one.');
    if (opt === 'split' && Math.floor(s.conflict.short / 2) === 0) return { ok: true, note: 'Shortfall of 1 splits to nothing.' };
    if (opt === 'trade' && s.week >= 12) return no('There is no next week.');
    return { ok: true };
  }
  function resolve(s0, opt) {
    const chk = canResolve(s0, opt);
    const s = clone(s0); s.fx = [];

function advise(g) {
  if (g.drawn === false) { const m = 'Draw this week’s event card first. It changes what you can do.'; return { director: m, researcher: m, engineer: m, explorer: m }; }
  const out = {}, open = P7.openSlots(g).length, rec = P7.recUsed(g);
  const free = g.wells.filter(w => !w.offline && !w.holder && !w.claim).length, claimed = g.wells.filter(w => w.claim && !w.holder).length;
  out.director = g.flags.requested ? (g.goodwill < 1 ? 'Stand Down banks a goodwill token for the next fight.' : 'Request is in for this week. Hold AP for the others.') : `Request now: ${free} wells free, ${claimed} claimed by rivals.`;
  out.researcher = g.persist.calBroken ? 'Pipeline is broken. Calibrate fixes it before any upload.' : g.flags.conjunction ? 'Conjunction: nothing goes out this week. Analyse to pack the recorder.' : !rec && g.week === 1 ? 'Recorder is empty until the robots report at week’s end. Calibrate now so data counts the moment it lands.' : open && rec ? `Upload now: ${P7.downlinkCap(g)} cards of capacity on ${open} slot${open > 1 ? 's' : ''}.` : (P7.live(g).find(o => !o.calibrated) ? `Attach calibration to “${P7.live(g).find(o => !o.calibrated).name}”.` : 'Calibration is attached everywhere.');
  out.engineer = g.persist.wheelDmg && !g.persist.safe ? 'Wheel damage doubles Explore cost. Repair fixes it for 1 AP.' : g.persist.safe ? 'Safe mode: Repair recovers it but needs one granted slot.' : g.persist.wheel ? 'Wheel fault halves yields. Service it with a granted slot.' : g.stuck ? 'Rover is stuck. Repair frees it without losing the stack.' : open ? 'Command Robots adds 8 cards but spends a slot.' : 'Nothing to fix.';
  out.explorer = g.flags.dust ? 'Dust storm: nothing can explore this week.' : g.stuck ? 'Stuck. Return clears it, and the stack.' : g.depth ? `Collect now: depth ${g.depth} gives ${g.depth * P7.COLLECT_PER_DEPTH} cards. Ending the week deep risks getting stuck (30%).` : (g.build.robots.some(r => P7.ROBOTS[r].mobile) ? 'Explore costs 3 AP, then 4, then 5. Collect consumes it.' : 'No rover aboard.');
  return out;
}

function projection(g, o) { // DERIVED: capacity left to this objective's deadline at 3 slots/week
  let c = 0; for (let w = g.week; w <= Math.min(12, o.deadline); w++) c += 3 * P7.cardsPerSlot({ ...g, flags: {}, week: w });
  return c;
}

/* Earth and Mars placed so their separation equals the real Horizons range for each week.
   Earth's heliocentric longitude starts at ~52° on 14 Nov and advances ~6.9° a week; Mars sits ahead
   by the angle the law of cosines gives for that range (orbits 1 AU and 1.524 AU). DERIVED, not an ephemeris. */
function orbit(g) {
  const au = APP.df.au; if (!au || au.length < 12) return '';
  const RE = 42, RM = 64, C = 80;
  const pos = w => {
    const d = au[w - 1], tE = (52 + (w - 1) * 6.9) * Math.PI / 180;
    const cphi = Math.max(-1, Math.min(1, (1 + 1.524 ** 2 - d * d) / (2 * 1.524)));
    const tM = tE + Math.acos(cphi);
    return { e: [C + RE * Math.cos(tE), C - RE * Math.sin(tE)], m: [C + RM * Math.cos(tM), C - RM * Math.sin(tM)], d };
  };
  const now = pos(g.week);
  const trail = Array.from({ length: g.week - 1 }, (_, i) => pos(i + 1)).map(p => `<circle cx="${p.e[0].toFixed(1)}" cy="${p.e[1].toFixed(1)}" r="1.4" fill="#2E5C8A" fill-opacity=".45"/><circle cx="${p.m[0].toFixed(1)}" cy="${p.m[1].toFixed(1)}" r="1.4" fill="#D2351E" fill-opacity=".45"/>`).join('');
  const km = Math.round(now.d * 149.6);
  return `<figure class="orbit" style="margin:0">
    <svg viewBox="0 0 160 160" role="img" aria-label="Orbit diagram, week ${g.week}: Earth and Mars ${now.d.toFixed(2)} AU apart, about ${km} million kilometres">
      <circle cx="${C}" cy="${C}" r="${RE}" fill="none" stroke="#2E5C8A" stroke-width=".8" stroke-dasharray="2 3"/>
      <circle cx="${C}" cy="${C}" r="${RM}" fill="none" stroke="#D2351E" stroke-width=".8" stroke-dasharray="2 3"/>
      <circle cx="${C}" cy="${C}" r="6" fill="#C08422" stroke="#1A1714" stroke-width=".8"/>
      ${trail}
      <path d="M${now.e[0].toFixed(1)} ${now.e[1].toFixed(1)}L${now.m[0].toFixed(1)} ${now.m[1].toFixed(1)}" stroke="#1A1714" stroke-width="1.2" stroke-dasharray="3 2"/>
      <circle cx="${now.e[0].toFixed(1)}" cy="${now.e[1].toFixed(1)}" r="5" fill="#2E5C8A" stroke="#1A1714" stroke-width=".8"/>
      <circle cx="${now.m[0].toFixed(1)}" cy="${now.m[1].toFixed(1)}" r="4.2" fill="#D2351E" stroke="#1A1714" stroke-width=".8"/>
      <text x="${(now.e[0] + 4).toFixed(1)}" y="${(now.e[1] + 14).toFixed(1)}" font-family="Archivo Narrow,Arial Narrow,sans-serif" font-weight="600" font-size="9" fill="#1A1714">Earth</text>
      <text x="${(now.m[0] + 5).toFixed(1)}" y="${(now.m[1] - 5).toFixed(1)}" font-family="Archivo Narrow,Arial Narrow,sans-serif" font-weight="600" font-size="9" fill="#1A1714">Mars</text>
    </svg>
    <figcaption><span class="num" style="font-size:13px;color:var(--ink)">${now.d.toFixed(3)} AU</span><sup class="tg tg-DATA">DATA</sup><br>${km} million km apart<br>Positions drawn from the range <sup class="tg tg-DERIVED">DRV</sup></figcaption>
  </figure>`;
}

/* What each action will do, worked out from the current state, shown before the click */
function preview(g, id) {
  const f = g.objectives.find(o => o.id === g.focus), fn = f ? `“${f.name}”` : 'your target', cps = P7.cardsPerSlot(g);
  const free = g.wells.filter(w => !w.offline && !w.holder && !w.claim).length, claimed = g.wells.filter(w => !w.offline && !w.holder && w.claim).length;
